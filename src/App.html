<script>
/* =========================================================================
 * Front-end (SPA) — JavaScript puro, sem dependências externas.
 * Toda chamada ao servidor passa por api(metodo, ...args) -> apiCall().
 * ========================================================================= */
var S = { ctx: null, view: 'painel', procId: null, tarefaId: null, aba: 'fluxo', det: null, tar: null };

// ------------------------------------------------------------------ utilitários
function api(metodo) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, falha) {
    google.script.run
      .withSuccessHandler(function (s) {
        var r = JSON.parse(s);
        if (r.ok) ok(r.data); else falha(new Error(r.erro));
      })
      .withFailureHandler(function (e) { falha(e instanceof Error ? e : new Error(String(e))); })
      .apiCall(metodo, args);
  });
}
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function brl(v) {
  if (v === null || v === undefined || v === '') return '—';
  return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function dataBR(s) {
  if (!s) return '—';
  var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return esc(s);
  if (String(s).length > 10) {
    var d = new Date(s);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  return m[3] + '/' + m[2] + '/' + m[1];
}
function hojeISO() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function $(sel, raiz) { return (raiz || document).querySelector(sel); }
function $$(sel, raiz) { return Array.prototype.slice.call((raiz || document).querySelectorAll(sel)); }
function tag(status, rotulo) { return '<span class="tag ' + esc(status) + '">' + esc(rotulo || ROTULOS[status] || status) + '</span>'; }
var ROTULOS = {
  ABERTA: 'Em andamento', AGUARDANDO_RETORNO: 'Aguardando retorno', AGUARDANDO: 'Aguardando', CONCLUIDA: 'Concluída',
  DEVOLVIDA: 'Devolvida', CANCELADA: 'Cancelada', NAO_INICIADA: 'Não iniciada', EM_ANDAMENTO: 'Em andamento', EM_ASSINATURA: 'Em assinatura (SUITE)',
  SUSPENSO: 'Suspenso', CONCLUIDO: 'Concluído', CANCELADO: 'Cancelado', RASCUNHO: 'Rascunho', FINAL: 'Final',
  RESPONDIDA: 'Respondida'
};
var ICONES = { ABERTA: '▶️', AGUARDANDO_RETORNO: '⏳', CONCLUIDA: '✅', DEVOLVIDA: '↩️', CANCELADA: '✖️', NAO_INICIADA: '⚪' };
function nomeFase(cod) {
  var f = (S.ctx.fases || []).filter(function (x) { return x.codigo === cod; })[0];
  return f ? f.nome : (cod || '—');
}
function nomeUsuario(email) {
  var u = (S.ctx.usuarios || []).filter(function (x) { return x.email === email; })[0];
  return u ? (u.nome || u.email) : (email || '—');
}
function nomeTipoDoc(cod) {
  var t = (S.ctx.tiposDocumento || []).filter(function (x) { return x.codigo === cod; })[0];
  return t ? t.nome : cod;
}
function podeEditar() { return S.ctx.usuario.papel !== 'CONSULTA'; }
function ehGestor() { return S.ctx.usuario.papel === 'ADMIN' || S.ctx.usuario.papel === 'GESTOR'; }
function opcoesUsuarios(sel) {
  return S.ctx.usuarios.map(function (u) {
    return '<option value="' + esc(u.email) + '"' + (u.email === sel ? ' selected' : '') + '>' + esc(u.nome || u.email) + '</option>';
  }).join('');
}
/** Sugestões para o campo "Responsável técnico" (texto livre): padrão + nomes dos usuários. */
function datalistUsuarios() {
  var nomes = [S.ctx.responsavelTecnicoPadrao].concat(S.ctx.usuarios.map(function (u) { return u.nome; }))
    .filter(function (n, i, arr) { return n && arr.indexOf(n) === i; });
  return '<datalist id="lista-resp-tecnico">' + nomes.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>';
}
function opcoesTiposDoc(sel) {
  return S.ctx.tiposDocumento.map(function (t) {
    return '<option value="' + esc(t.codigo) + '"' + (t.codigo === sel ? ' selected' : '') + '>' + esc(t.nome) + '</option>';
  }).join('');
}
var _toastTimer;
function toast(msg, erro) {
  var t = $('#toast');
  t.textContent = msg; t.className = 'toast' + (erro ? ' erro' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function () { t.className = 'toast oculto'; }, erro ? 7000 : 3000);
}
function ocupado(promessa, msgOk) {
  $('#ocupado').classList.remove('oculto');
  return promessa.then(function (r) {
    if (msgOk) toast(msgOk);
    return r;
  }).catch(function (e) {
    toast(e.message, true);
    throw e;
  }).finally(function () { $('#ocupado').classList.add('oculto'); });
}
function lerArquivo(input) {
  return new Promise(function (ok, falha) {
    var f = input.files && input.files[0];
    if (!f) return falha(new Error('Selecione um arquivo.'));
    if (f.size > 40 * 1024 * 1024) return falha(new Error('Arquivo maior que 40 MB.'));
    var r = new FileReader();
    r.onload = function () { ok({ nome: f.name, mimeType: f.type, base64: String(r.result).split(',')[1] }); };
    r.onerror = function () { falha(new Error('Falha ao ler o arquivo.')); };
    r.readAsDataURL(f);
  });
}
function valoresForm(raiz) {
  var v = {};
  $$('[name]', raiz).forEach(function (el) {
    if (el.type === 'radio') { if (el.checked) v[el.name] = el.value; return; }
    if (el.type === 'checkbox') { v[el.name] = el.checked; return; }
    v[el.name] = el.value;
  });
  return v;
}
function app(html) { $('#app').innerHTML = html; }
/** Logos clicáveis dos sistemas externos configurados para a tela/etapa (APP.SISTEMAS_EXTERNOS). */
function logosExternos(tela) {
  return (S.ctx.sistemasExternos || []).filter(function (s) { return s.etapas.indexOf(tela) >= 0; }).map(function (s) {
    return '<a class="logo-externo" href="' + esc(s.url) + '" target="_blank" rel="noopener" title="Abrir o ' + esc(s.nome) + ' em nova aba">' +
      (s.logo ? '<img src="' + s.logo + '" alt="' + esc(s.nome) + '">' : '<span>Abrir ' + esc(s.nome) + ' ↗</span>') + '</a>';
  }).join('');
}

// ------------------------------------------------------------------ rotas (URL)
/*
 * A URL do Web App reflete a tela atual no fragmento (#). O Apps Script não
 * permite alterar o caminho da URL depois que a página carrega.
 *   …/exec#/painel
 *   …/exec#/processos
 *   …/exec#/novo-processo
 *   …/exec#/processo/CESOP-2026-001                (aba Fluxo, etapa atual)
 *   …/exec#/processo/CESOP-2026-001/etapa/DFD      (etapa específica)
 *   …/exec#/processo/CESOP-2026-001/documentos     (também diligencias, dados, historico)
 *   …/exec#/admin
 * Os links podem ser copiados/compartilhados e os botões Voltar/Avançar funcionam.
 */
var ABAS = ['fluxo', 'documentos', 'diligencias', 'dados', 'historico'];
var Rotas = {
  _atual: null,
  _historico: function () { return window.google && google.script && google.script.history; },

  /** Monta o fragmento a partir do estado atual. */
  montar: function () {
    switch (S.view) {
      case 'processos': return '/processos';
      case 'novo': return '/novo-processo';
      case 'admin': return '/admin';
      case 'processo': {
        var num = S.det && S.det.processo && S.det.processo.id === S.procId ? S.det.processo.numero : S.procId;
        var base = '/processo/' + encodeURIComponent(num);
        if (S.aba && S.aba !== 'fluxo') return base + '/' + S.aba;
        var cod = S.tar && S.tar.tarefa && S.tar.tarefa.id === S.tarefaId ? S.tar.tarefa.etapaCodigo : '';
        return base + (cod ? '/etapa/' + encodeURIComponent(cod) : '');
      }
      default: return '/painel';
    }
  },

  /** Interpreta um fragmento. Retorna {view, params} ou null se inválido. */
  ler: function (hash) {
    var partes = String(hash || '').replace(/^#/, '').split('/').filter(String).map(decodeURIComponent);
    var simples = { '': 'painel', painel: 'painel', processos: 'processos', 'novo-processo': 'novo', admin: 'admin' };
    if (partes.length <= 1 && simples.hasOwnProperty(partes[0] || '')) return { view: simples[partes[0] || ''], params: {} };
    if (partes[0] === 'processo' && partes[1]) {
      var p = { procId: partes[1], tarefaId: null, etapaRota: null, aba: 'fluxo' };
      if (partes[2] === 'etapa' && partes[3]) p.etapaRota = partes[3];
      else if (partes[2] && ABAS.indexOf(partes[2]) >= 0) p.aba = partes[2];
      return { view: 'processo', params: p };
    }
    return null;
  },

  /** Atualiza a URL se a tela mudou (substituir = não cria entrada no histórico). */
  atualizar: function (substituir) {
    var h = this.montar();
    if (h === this._atual) return;
    var primeira = this._atual === null;
    this._atual = h;
    var hist = this._historico();
    if (hist) hist[substituir || primeira ? 'replace' : 'push'](null, {}, h);
    else if (substituir || primeira) history.replaceState(null, '', '#' + h);
    else location.hash = h;
  },

  /** Abre a tela correspondente a um fragmento (carga inicial, Voltar/Avançar). */
  aplicar: function (hash) {
    var r = this.ler(hash);
    if (!r) { toast('Endereço não encontrado. Abrindo o painel.', true); r = { view: 'painel', params: {} }; }
    this._atual = String(hash || '').replace(/^#/, '') || null;
    return ir(r.view, r.params);
  },

  iniciar: function () {
    var self = this;
    var hist = this._historico();
    if (hist) {
      hist.setChangeHandler(function (e) { self.aplicar(e.location && e.location.hash); });
      google.script.url.getLocation(function (loc) { self.aplicar(loc.hash); });
    } else {
      window.addEventListener('popstate', function () { self.aplicar(location.hash); });
      self.aplicar(location.hash);
    }
  }
};

// ------------------------------------------------------------------ navegação
function ir(view, params) {
  S.view = view;
  S.autoSelecionada = false;
  if (view !== 'processo') { S.det = null; S.tar = null; }
  if (params) for (var k in params) S[k] = params[k];
  $$('#menu a').forEach(function (a) { a.classList.toggle('ativo', a.dataset.view === view); });
  app('<div class="carregando">Carregando…</div>');
  var r = { painel: vPainel, processos: vProcessos, novo: vNovo, processo: vProcesso, admin: vAdmin }[view];
  return Promise.resolve(r()).then(function () {
    // Etapa escolhida automaticamente (etapa atual): substitui em vez de criar outra entrada no histórico
    Rotas.atualizar(view === 'processo' && S.autoSelecionada);
  }).catch(function (e) {
    app('<div class="card"><b>Erro:</b> ' + esc(e.message) + '</div>');
  });
}
function abrirProcesso(id, tarefaId, aba) {
  return ir('processo', { procId: id, tarefaId: tarefaId || null, etapaRota: null, aba: aba || 'fluxo' });
}

// ------------------------------------------------------------------ PAINEL
function vPainel() {
  return api('painel').then(function (d) {
    var k = d.indicadores;
    var kpi = function (v, r) { return '<div class="kpi"><div class="v">' + v + '</div><div class="r">' + r + '</div></div>'; };
    var linhaTarefa = function (t, extra) {
      return '<tr class="clicavel" data-acao="abrirTarefa" data-proc="' + esc(t.processoId) + '" data-tarefa="' + esc(t.id) + '">' +
        '<td><b>' + esc(t.numero) + '</b><br><span class="ajuda">' + esc(t.titulo) + '</span></td>' +
        '<td>' + esc(t.nome) + '</td><td>' + extra(t) + '</td></tr>';
    };
    var fases = S.ctx.fases.filter(function (f) { return f.codigo !== 'CONCLUIDO'; });
    var porFase = {};
    d.processos.forEach(function (p) { (porFase[p.fase] = porFase[p.fase] || []).push(p); });

    app('<h1>Painel</h1>' +
      '<div class="kpis">' + kpi(k.emAndamento, 'Processos em andamento') + kpi(k.minhasTarefas, 'Minhas tarefas') +
      kpi(k.aguardandoRetorno, 'Aguardando outro setor') + kpi(k.atrasadas, 'Tarefas atrasadas') +
      kpi(k.diligenciasAbertas, 'Diligências abertas') + '</div>' +
      '<div class="grid g2">' +
      '<div class="card"><h2>Minhas tarefas</h2>' + (d.minhasTarefas.length ?
        '<table><tr><th>Processo</th><th>Etapa</th><th>Prazo</th></tr>' + d.minhasTarefas.map(function (t) {
          return linhaTarefa(t, function (t) { return dataBR(t.prazo) + (t.atrasada ? ' ' + tag('atraso', 'Atrasada') : ''); });
        }).join('') + '</table>' : '<div class="vazio">Nenhuma tarefa atribuída a você.</div>') + '</div>' +
      '<div class="card"><h2>Aguardando retorno de outros setores</h2>' + (d.aguardandoRetorno.length ?
        '<table><tr><th>Processo</th><th>Etapa</th><th>Aguardando</th></tr>' + d.aguardandoRetorno.map(function (t) {
          return linhaTarefa(t, function (t) { return '<b>' + (t.diasAguardando || 0) + ' dias</b><br><span class="ajuda">desde ' + dataBR(t.enviadoEm) + '</span>'; });
        }).join('') + '</table>' : '<div class="vazio">Nada aguardando retorno.</div>') +
      (d.diligencias.length ? '<h2 style="margin-top:16px">Diligências abertas</h2><table><tr><th>Processo</th><th>Despacho</th><th>Prazo</th></tr>' +
        d.diligencias.map(function (x) {
          return '<tr class="clicavel" data-acao="abrirProcesso" data-proc="' + esc(x.processoId) + '" data-aba="diligencias"><td>' + esc(x.numero) +
            '</td><td>' + esc(x.numeroDespacho) + '</td><td>' + dataBR(x.prazo) + (x.atrasada ? ' ' + tag('atraso', 'Vencida') : '') + '</td></tr>';
        }).join('') + '</table>' : '') + '</div>' +
      '</div>' +
      '<div class="card"><h2>Processos por fase</h2><div class="kanban">' + fases.map(function (f) {
        var lista = porFase[f.codigo] || [];
        return '<div class="coluna"><h3><span>' + esc(f.nome) + '</span><span>' + lista.length + '</span></h3>' +
          lista.map(function (p) {
            return '<div class="cartao" data-acao="abrirProcesso" data-proc="' + esc(p.id) + '">' +
              '<div class="n">' + esc(p.numero) + (p.numeroSuite ? ' · SUITE ' + esc(p.numeroSuite) : '') + '</div>' +
              '<div class="t">' + esc(p.titulo) + '</div>' +
              '<div class="e">' + p.etapasAtuais.map(function (e) { return (ICONES[e.status] || '') + ' ' + esc(e.nome); }).join('<br>') + '</div>' +
              (p.atrasado ? tag('atraso', 'Atrasado') : '') + '</div>';
          }).join('') + '</div>';
      }).join('') + '</div></div>');
  });
}

// ------------------------------------------------------------------ LISTA
function vProcessos() {
  var filtro = S.filtro || { texto: '', status: '' };
  return api('listarProcessos', filtro).then(function (lista) {
    app('<h1>Processos</h1><div class="card"><div class="linha">' +
      '<div><input id="f-texto" placeholder="Buscar por número, título, objeto ou SUITE" value="' + esc(filtro.texto) + '"></div>' +
      '<div style="flex:0 0 200px"><select id="f-status"><option value="">Todos os status</option>' +
      ['EM_ANDAMENTO', 'SUSPENSO', 'CONCLUIDO', 'CANCELADO'].map(function (s) {
        return '<option value="' + s + '"' + (filtro.status === s ? ' selected' : '') + '>' + ROTULOS[s] + '</option>';
      }).join('') + '</select></div><div style="flex:0 0 auto"><button class="btn" data-acao="filtrar">Filtrar</button></div></div></div>' +
      '<div class="card">' + (lista.length ? '<table><tr><th>Número</th><th>Título</th><th>Status</th><th>Fase</th><th>Etapa(s) atual(is)</th><th>Analista responsável</th><th class="num">Valor estimado</th></tr>' +
        lista.map(function (p) {
          return '<tr class="clicavel" data-acao="abrirProcesso" data-proc="' + esc(p.id) + '"><td><b>' + esc(p.numero) + '</b>' +
            (p.numeroSuite ? '<br><span class="ajuda">SUITE ' + esc(p.numeroSuite) + '</span>' : '') + '</td><td>' + esc(p.titulo) + '</td>' +
            '<td>' + tag(p.status) + (p.atrasado ? ' ' + tag('atraso', 'Atrasado') : '') + '</td><td>' + esc(nomeFase(p.fase)) + '</td>' +
            '<td>' + p.etapasAtuais.map(function (e) { return (ICONES[e.status] || '') + ' ' + esc(e.nome); }).join('<br>') + '</td>' +
            '<td>' + esc(nomeUsuario(p.responsavelEmail)) + '</td><td class="num">' + brl(p.valorEstimado) + '</td></tr>';
        }).join('') + '</table>' : '<div class="vazio">Nenhum processo encontrado.</div>') + '</div>');
  });
}

// ------------------------------------------------------------------ NOVO
function vNovo() {
  if (!podeEditar()) { app('<div class="card">Seu perfil é somente leitura.</div>'); return; }
  app('<div class="card" id="form-novo" style="max-width:760px"><div class="cab-proc"><h1>Novo processo de contratação</h1>' +
    '<div class="logos-externos">' + logosExternos('NOVO') + '</div></div>' +
    '<label>Fluxo</label><select name="fluxoId">' + S.ctx.fluxos.map(function (f) { return '<option value="' + esc(f.id) + '">' + esc(f.nome) + '</option>'; }).join('') + '</select>' +
    '<label>Título <span class="obrig">*</span></label><input name="titulo" placeholder="Ex.: Novo contrato SGS">' +
    '<label>Objeto da contratação <span class="obrig">*</span></label><textarea name="objeto"></textarea>' +
    '<div class="linha"><div><label>Setor demandante</label><input name="setorDemandante"></div>' +
    '<div><label>Nº do processo SUITE (se já houver)</label><input name="numeroSuite"></div></div>' +
    '<div class="linha"><div><label>Analista responsável</label><select name="responsavelEmail">' + opcoesUsuarios(S.ctx.usuario.email) + '</select></div>' +
    '<div><label>Responsável técnico</label><input name="responsavelTecnico" list="lista-resp-tecnico" value="' + esc(S.ctx.responsavelTecnicoPadrao) + '"></div></div>' +
    datalistUsuarios() +
    '<p class="ajuda">Ao criar, o sistema gera o número do processo, cria a estrutura de pastas no Drive e inicia o fluxo.</p>' +
    '<div class="acoes"><button class="btn" data-acao="criarProcesso">Criar processo</button></div></div>');
}

// ------------------------------------------------------------------ DETALHE DO PROCESSO
function vProcesso() {
  return api('detalharProcesso', S.procId).then(function (det) {
    S.det = det;
    S.procId = det.processo.id; // a URL pode trazer o número; daqui em diante usa o id interno
    var p = det.processo;
    var gestao = ehGestor() ? (
      p.status === 'EM_ANDAMENTO' ? '<button class="btn sec peq" data-acao="statusProcesso" data-status="SUSPENSO">Suspender</button> ' +
        '<button class="btn perigo peq" data-acao="statusProcesso" data-status="CANCELADO">Cancelar</button>' :
      p.status === 'SUSPENSO' ? '<button class="btn peq" data-acao="statusProcesso" data-status="EM_ANDAMENTO">Retomar</button> ' +
        '<button class="btn perigo peq" data-acao="statusProcesso" data-status="CANCELADO">Cancelar</button>' : '') : '';
    var abas = [['fluxo', 'Fluxo e etapas'], ['documentos', 'Documentos (' + det.documentos.length + ')'],
      ['diligencias', 'Diligências (' + det.diligencias.length + ')'], ['dados', 'Dados'], ['historico', 'Histórico']];
    app('<div class="card"><div class="cab-proc"><div><h1 style="margin:0">' + esc(p.numero) + ' — ' + esc(p.titulo) + '</h1>' +
      '<div class="meta">' + tag(p.status) + ' &nbsp; Fase: <b>' + esc(nomeFase(p.fase)) + '</b> &nbsp;·&nbsp; SUITE: <b>' + esc(p.numeroSuite || '—') +
      '</b> &nbsp;·&nbsp; Analista responsável: <b>' + esc(nomeUsuario(p.responsavelEmail)) + '</b> &nbsp;·&nbsp; Responsável técnico: <b>' +
      esc(p.responsavelTecnico || '—') + '</b> &nbsp;·&nbsp; Valor estimado: <b>' + brl(p.valorEstimado) + '</b></div>' +
      '<div class="meta">' + esc(p.objeto) + '</div></div>' +
      '<div class="acoes"><a class="btn sec peq" href="' + esc(p.pastaUrl) + '" target="_blank">📂 Pasta no Drive</a> ' + gestao + '</div></div></div>' +
      '<div class="abas">' + abas.map(function (a) {
        return '<a href="#" data-acao="aba" data-aba="' + a[0] + '" class="' + (S.aba === a[0] ? 'ativo' : '') + '">' + a[1] + '</a>';
      }).join('') + '</div><div id="conteudo-aba"></div>');
    return renderAba();
  });
}

function renderAba() {
  var alvo = $('#conteudo-aba');
  var r = { fluxo: abaFluxo, documentos: abaDocumentos, diligencias: abaDiligencias, dados: abaDados, historico: abaHistorico }[S.aba];
  return Promise.resolve(r(alvo));
}

// ---------- aba Fluxo: linha do tempo + área de trabalho da etapa
function abaFluxo(alvo) {
  var det = S.det;
  S.autoSelecionada = false;
  if (S.etapaRota) {
    var daRota = det.linhaDoTempo.filter(function (e) { return e.codigo === S.etapaRota && e.tarefaId; })[0];
    if (daRota) S.tarefaId = daRota.tarefaId;
    else toast('A etapa "' + S.etapaRota + '" ainda não foi iniciada neste processo.', true);
    S.etapaRota = null;
  }
  if (!S.tarefaId) {
    S.autoSelecionada = true;
    var ativa = det.tarefas.filter(function (t) { return t.status === 'ABERTA' || t.status === 'AGUARDANDO_RETORNO'; })[0];
    var ultima = det.tarefas.filter(function (t) { return t.tipo === 'TAREFA' || t.tipo === 'DECISAO'; }).slice(-1)[0];
    S.tarefaId = (ativa || ultima || {}).id || null;
  }
  var faseAtual = null;
  var tl = det.linhaDoTempo.map(function (e) {
    var cab = '';
    if (e.fase !== faseAtual) { faseAtual = e.fase; cab = '<div class="fase">' + esc(nomeFase(e.fase)) + '</div>'; }
    var clic = e.tarefaId ? ' data-acao="selTarefa" data-tarefa="' + esc(e.tarefaId) + '"' : '';
    return cab + '<div class="item' + (e.tarefaId ? '' : ' inativo') + (e.tarefaId && e.tarefaId === S.tarefaId ? ' sel' : '') + '"' + clic + '>' +
      '<span class="ico">' + (ICONES[e.status] || '⚪') + '</span><span style="flex:1">' + esc(e.nome) +
      (e.instancias > 1 ? ' <span class="ajuda">(' + e.instancias + 'x)</span>' : '') + '</span></div>';
  }).join('');
  alvo.innerHTML = '<div class="fluxo"><div class="card timeline"><h2>Etapas</h2>' + tl + '</div>' +
    '<div id="area-trabalho">' + (S.tarefaId ? '<div class="carregando">Carregando etapa…</div>' : '<div class="card vazio">Selecione uma etapa.</div>') + '</div></div>';
  if (S.tarefaId) return carregarTarefa(S.tarefaId);
}

function carregarTarefa(id) {
  S.tarefaId = id;
  $$('.timeline .item').forEach(function (el) { el.classList.toggle('sel', el.dataset.tarefa === id); });
  return api('abrirTarefa', id).then(function (w) { S.tar = w; renderTrabalho(); })
    .catch(function (e) { $('#area-trabalho').innerHTML = '<div class="card">Erro: ' + esc(e.message) + '</div>'; });
}

function renderTrabalho() {
  var w = S.tar, t = w.tarefa, e = w.etapa;
  var ed = w.ativa && podeEditar();
  var cab = '<div class="card"><div class="cab-proc"><div><h2 style="margin:0">' + esc(e.nome) + '</h2>' +
    '<div class="meta">' + tag(t.status) + ' &nbsp; Setor: <b>' + esc(t.setor || '—') + '</b> &nbsp;·&nbsp; Prazo: <b>' + dataBR(t.prazo) + '</b>' +
    (t.concluidaEm ? ' &nbsp;·&nbsp; Encerrada em ' + dataBR(t.concluidaEm) + ' por ' + esc(nomeUsuario(t.concluidaPor)) : '') + '</div>' +
    (e.descricao ? '<div class="meta">' + esc(e.descricao) + '</div>' : '') +
    (t.observacao ? '<div class="meta">📝 ' + esc(t.observacao) + '</div>' : '') + '</div>' +
    '<div style="min-width:220px">' + (logosExternos(e.codigo) ? '<div class="logos-externos">' + logosExternos(e.codigo) + '</div>' : '') +
    '<label style="margin-top:0">Analista responsável</label>' +
    (ed ? '<select id="sel-resp" data-change="atribuir">' + opcoesUsuarios(t.responsavelEmail) + '</select>' : '<div>' + esc(nomeUsuario(t.responsavelEmail)) + '</div>') +
    '</div></div></div>';

  var pend = '';
  if (w.ativa) {
    pend = w.pendencias.length
      ? '<div class="pend"><b>Pendências para concluir esta etapa:</b><ul>' + w.pendencias.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>'
      : '<div class="ok-box">✅ Tudo pronto. A etapa pode ser concluída.</div>';
  }

  var html = { A: bFormulario, B: bDocumentos, C: bChecklist, D: bSolicitacao, E: bCotacoes, F: bDecisao, I: bInstrucao, M: bMapa };
  var blocos = w.blocos.map(function (b) { return html[b] ? html[b](w, ed) : ''; }).join('');

  var rodape = '';
  if (ed) {
    rodape = '<div class="card"><div class="linha"><div><label style="margin-top:0">Observação (opcional)</label><input id="obs-concluir"></div>' +
      '<div style="flex:0 0 auto;align-self:end"><button class="btn verde" data-acao="concluir"' + (w.pendencias.length ? ' disabled' : '') + '>Concluir etapa ▶</button></div></div>' +
      (w.destinosDevolucao.length ? '<details style="margin-top:12px"><summary>Devolver para etapa anterior</summary><div class="linha">' +
        '<div><label>Devolver para</label><select id="dev-destino">' + w.destinosDevolucao.map(function (d) {
          return '<option value="' + esc(d.codigo) + '">' + esc(d.nome) + '</option>';
        }).join('') + '</select></div><div><label>Motivo <span class="obrig">*</span></label><input id="dev-motivo"></div>' +
        '<div style="flex:0 0 auto;align-self:end"><button class="btn perigo" data-acao="devolver">◀ Devolver</button></div></div></details>' : '') + '</div>';
  }
  $('#area-trabalho').innerHTML = cab + pend + blocos + rodape;
}

// ---------- blocos da área de trabalho
/** Sugestão de preenchimento (cfg_Campos.valorPadrao) com botão "Usar". */
function sugestaoHtml(c, ed) {
  var s = S.tar && S.tar.sugestoes && S.tar.sugestoes[c.chave];
  if (!s || !ed) return '';
  var atual = S.tar.valores[c.chave];
  if (atual !== undefined && String(atual) === String(s.valor)) return '';
  var exibir = c.tipo === 'moeda' ? brl(s.valor) : String(s.valor);
  if (exibir.length > 220) exibir = exibir.slice(0, 220) + '…';
  return '<div class="sugestao">💡 <b>Sugestão</b> <span class="ajuda">(' + esc(s.origem) + ')</span>: ' + esc(exibir) +
    ' <button class="btn sec peq" data-acao="usarSugestao" data-campo="' + esc(c.chave) + '">Usar</button></div>';
}

function permiteNsa(c) { return c.tipo === 'secaoLei' && /(^|[,;\s])NSA($|[,;\s])/i.test(c.opcoes || ''); }

/** Seção de documento (ex.: inciso do ETP): recolhível, com "Não se aplica" quando permitido. */
function secaoHtml(c, w, ed) {
  var v = w.valores[c.chave] || '';
  var nsa = permiteNsa(c) && w.valores[c.chave + '_nsa'] === 'true';
  var ok = String(v).trim() !== '';
  var ico = ok ? (nsa ? '➖' : '✅') : '⚪';
  var dis = ed ? '' : ' disabled';
  return '<details class="secao' + (ok ? ' ok' : '') + '"' + (ok ? '' : ' open') + ' data-secao="' + esc(c.chave) + '">' +
    '<summary><span class="ico">' + ico + '</span><span>' + esc(c.rotulo) + (permiteNsa(c) ? '' : ' <span class="obrig">*</span>') + '</span>' +
    (nsa ? ' <span class="tag RASCUNHO">Não se aplica</span>' : '') + '</summary><div class="secao-corpo">' +
    (c.ajuda ? '<div class="ajuda">' + esc(c.ajuda) + '</div>' : '') +
    (permiteNsa(c) ? '<label class="check" style="font-weight:normal"><input type="checkbox" name="' + esc(c.chave) + '_nsa" data-change="nsa"' +
      (nsa ? ' checked' : '') + dis + '> Não se aplica <span class="ajuda">(art. 18, §2º — justifique abaixo)</span></label>' : '') +
    '<textarea class="grande" name="' + esc(c.chave) + '" placeholder="' + (nsa ? 'Justificativa do “Não se aplica”' : 'Texto da seção') + '"' + dis + '>' +
    esc(v) + '</textarea>' + sugestaoHtml(c, ed) + '</div></details>';
}

function campoHtml(c, valor, ed) {
  if (c.tipo === 'secaoLei') return secaoHtml(c, S.tar, ed);
  var dis = ed ? '' : ' disabled';
  var v = valor === undefined || valor === null ? '' : valor;
  var rot = '<label>' + esc(c.rotulo) + (c.obrigatorio ? ' <span class="obrig">*</span>' : '') + '</label>';
  var inp;
  switch (c.tipo) {
    case 'textoLongo': inp = '<textarea name="' + esc(c.chave) + '"' + dis + '>' + esc(v) + '</textarea>'; break;
    case 'numero': case 'moeda': inp = '<input type="number" step="' + (c.tipo === 'moeda' ? '0.01' : 'any') + '" name="' + esc(c.chave) + '" value="' + esc(v) + '"' + dis + '>'; break;
    case 'data': inp = '<input type="date" name="' + esc(c.chave) + '" value="' + esc(v) + '"' + dis + '>'; break;
    case 'email': inp = '<input type="email" name="' + esc(c.chave) + '" value="' + esc(v) + '"' + dis + '>'; break;
    case 'simNao': c = Object.assign({}, c, { opcoes: 'SIM;NAO' }); // segue para seleção
    case 'selecao':
      inp = '<select name="' + esc(c.chave) + '"' + dis + '><option value="">— selecione —</option>' +
        String(c.opcoes || '').split(';').filter(String).map(function (o) {
          o = o.trim();
          return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(o === 'NAO' ? 'NÃO' : o) + '</option>';
        }).join('') + '</select>';
      break;
    default: inp = '<input name="' + esc(c.chave) + '" value="' + esc(v) + '"' + dis + '>';
  }
  return '<div>' + rot + inp + (c.ajuda ? '<div class="ajuda">' + esc(c.ajuda) + '</div>' : '') + sugestaoHtml(c, ed) + '</div>';
}

function bFormulario(w, ed) {
  if (!w.campos.length) return '';
  var secoes = w.campos.filter(function (c) { return c.tipo === 'secaoLei'; });
  var feitas = secoes.filter(function (c) { return String(w.valores[c.chave] || '').trim() !== ''; }).length;
  var progresso = secoes.length ? '<span class="progresso"><span style="width:' + Math.round(100 * feitas / secoes.length) + '%"></span></span>' +
    '<span class="ajuda">' + feitas + ' de ' + secoes.length + ' seções preenchidas</span>' : '';
  return '<div class="bloco" id="bloco-form"><h3><span>Dados da etapa</span><span class="acoes">' + progresso +
    (secoes.length ? '<button class="btn sec peq" data-acao="expandirSecoes">Expandir/recolher</button>' : '') + '</span></h3>' +
    w.campos.map(function (c) { return campoHtml(c, w.valores[c.chave], ed); }).join('') +
    (ed ? '<div class="acoes barra-salvar"><button class="btn" data-acao="salvarCampos" data-raiz="#bloco-form">Salvar dados</button>' +
      '<span class="ajuda">Salve com frequência — os textos ficam guardados como rascunho até a conclusão da etapa.</span></div>' : '') + '</div>';
}

function bDecisao(w, ed) {
  if (!w.decisao) return '';
  var v = w.valores[w.decisao.variavel] || '';
  return '<div class="bloco" id="bloco-decisao"><h3>Decisão</h3><p>' + esc(w.etapa.descricao || w.etapa.nome) + '</p>' +
    w.decisao.opcoes.map(function (o) {
      return '<label class="check" style="font-weight:normal"><input type="radio" name="' + esc(w.decisao.variavel) + '" value="' + esc(o) + '"' +
        (o === v ? ' checked' : '') + (ed ? '' : ' disabled') + '> ' + esc(o === 'NAO' ? 'NÃO' : o) + '</label>';
    }).join('') +
    (ed ? '<div class="acoes" style="margin-top:8px"><button class="btn" data-acao="salvarCampos" data-raiz="#bloco-decisao">Registrar decisão</button></div>' : '') + '</div>';
}

function bChecklist(w, ed) {
  if (!w.checklist.length) return '';
  return '<div class="bloco"><h3>Checklist</h3>' + w.checklist.map(function (i) {
    return '<label class="check" style="font-weight:normal"><input type="checkbox" data-acao="checklist" data-item="' + esc(i.id) + '"' +
      (i.marcado ? ' checked' : '') + (ed ? '' : ' disabled') + '> ' + esc(i.descricao) + (i.obrigatorio ? ' <span class="obrig">*</span>' : '') + '</label>';
  }).join('') + '</div>';
}

function exigeAssinatura(tipo) { return ((S.ctx.assinaturasPorTipo || {})[tipo] || []).length > 0; }

/** Ações do documento conforme status e exigência de assinatura no SUITE. */
function acoesDoc(d, ed) {
  if (!ed) return '';
  var b = function (acao, rotulo, extra, cls) {
    return '<button class="btn ' + (cls || 'sec') + ' peq" data-acao="' + acao + '" data-doc="' + esc(d.id) + '"' + (extra || '') + '>' + rotulo + '</button> ';
  };
  if (exigeAssinatura(d.tipoCodigo) && d.origem === 'GERADO') {
    if (d.status === 'RASCUNHO') return b('enviarAssinatura', '✍️ Enviar para assinatura (SUITE)', '', '');
    if (d.status === 'EM_ASSINATURA') return b('statusDoc', 'Cancelar assinatura', ' data-status="RASCUNHO"');
    return b('statusDoc', 'Voltar a rascunho', ' data-status="RASCUNHO"');
  }
  return b('statusDoc', d.status === 'FINAL' ? 'Voltar a rascunho' : 'Marcar como final', ' data-status="' + (d.status === 'FINAL' ? 'RASCUNHO' : 'FINAL') + '"');
}

/** Linha de assinaturas do documento (quem já assinou no SUITE). */
function linhaAssinaturas(d, assinaturas, ed) {
  var l = (assinaturas || []).filter(function (a) { return a.documentoId === d.id; });
  if (!l.length || d.status === 'RASCUNHO') return '';
  return '<tr class="sub"><td colspan="6"><div class="assinaturas">' +
    (d.pdfUrl ? '<a class="btn sec peq" href="' + esc(d.pdfUrl) + '" target="_blank">📄 PDF para o SUITE</a> ' : '') +
    l.map(function (a) {
      var assinado = a.status === 'ASSINADO';
      return '<span class="assinante ' + (assinado ? 'ok' : '') + '">' + (assinado ? '✅' : '⏳') + ' <b>' + esc(a.signatario) + '</b>' +
        (a.cargo ? ' <span class="ajuda">' + esc(a.cargo) + '</span>' : '') +
        (assinado ? ' <span class="ajuda">em ' + dataBR(a.assinadoEm) + '</span>' :
          (ed && d.status === 'EM_ASSINATURA' ? ' <button class="btn peq" data-acao="registrarAssinatura" data-id="' + esc(a.id) + '">Assinou</button>' : '')) +
        '</span>';
    }).join('') + '</div></td></tr>';
}

function tabelaDocs(docs, ed, assinaturas) {
  if (!docs.length) return '<div class="vazio">Nenhum documento.</div>';
  return '<table><tr><th>Documento</th><th>Tipo</th><th>Versão</th><th>Status</th><th>Criado</th><th></th></tr>' + docs.map(function (d) {
    var assina = exigeAssinatura(d.tipoCodigo);
    return '<tr><td><a href="' + esc(d.url) + '" target="_blank">' + esc(d.nome) + '</a>' +
      (assina ? '<br><span class="ajuda">✍️ Assinam: ' + esc(S.ctx.assinaturasPorTipo[d.tipoCodigo].map(function (a) { return a.signatario === '{{responsavelTecnico}}' ? 'Resp. técnico' : a.signatario; }).join(', ')) + '</span>' : '') +
      '</td><td>' + esc(nomeTipoDoc(d.tipoCodigo)) + '</td>' +
      '<td>v' + esc(d.versao) + '</td><td>' + tag(d.status) + '</td><td>' + dataBR(d.criadoEm) + '<br><span class="ajuda">' + esc(nomeUsuario(d.criadoPor)) + '</span></td>' +
      '<td>' + acoesDoc(d, ed) + '</td></tr>' + linhaAssinaturas(d, assinaturas, ed);
  }).join('') + '</table>';
}

function formAnexo(prefixo, tipoPadrao) {
  return '<div class="linha" style="margin-top:10px"><div><label>Tipo</label><select id="' + prefixo + '-tipo">' + opcoesTiposDoc(tipoPadrao || 'OUTRO') + '</select></div>' +
    '<div><label>Arquivo</label><input type="file" id="' + prefixo + '-arq"></div>' +
    '<div style="flex:0 0 auto;align-self:end"><button class="btn sec" data-acao="anexar" data-prefixo="' + prefixo + '">📎 Anexar</button></div></div>' +
    '<div class="linha"><div><label>…ou vincular arquivo já existente no Drive (link)</label><input id="' + prefixo + '-link" placeholder="https://drive.google.com/..."></div>' +
    '<div style="flex:0 0 auto;align-self:end"><button class="btn sec" data-acao="vincular" data-prefixo="' + prefixo + '">🔗 Vincular</button></div></div>';
}

function bDocumentos(w, ed) {
  var tipo = w.etapa.documentoTipo;
  return '<div class="bloco"><h3><span>Documentos' + (tipo ? ' — ' + esc(nomeTipoDoc(tipo)) : '') + '</span>' +
    (ed && tipo && tipo !== 'MAPA_PRECOS' ? '<button class="btn peq" data-acao="gerarDoc" data-tipo="' + esc(tipo) + '">📝 Gerar a partir do modelo</button>' : '') + '</h3>' +
    tabelaDocs(w.documentos, ed, w.assinaturas) + (ed ? formAnexo('wt', tipo) : '') + '</div>';
}

function bSolicitacao(w, ed) {
  var t = w.tarefa;
  var h = '<div class="bloco"><h3>Solicitação a outro setor</h3>';
  if (t.enviadoEm) h += '<p>📤 Enviado em <b>' + dataBR(t.enviadoEm) + '</b>' + (t.referenciaEnvio ? ' — ' + esc(t.referenciaEnvio) : '') + '</p>';
  if (t.retornoEm) h += '<p>📥 Retorno em <b>' + dataBR(t.retornoEm) + '</b>' + (t.referenciaRetorno ? ' — ' + esc(t.referenciaRetorno) : '') + '</p>';
  if (ed && t.status === 'ABERTA') {
    h += '<div class="linha"><div><label>' + (t.retornoEm ? 'Novo envio — ' : '') + 'Referência do envio (ofício, despacho, e-mail)</label><input id="env-ref"></div>' +
      '<div style="flex:0 0 160px"><label>Data</label><input type="date" id="env-data" value="' + hojeISO() + '"></div>' +
      '<div style="flex:0 0 auto;align-self:end"><button class="btn" data-acao="registrarEnvio">📤 Registrar envio</button></div></div>';
  }
  if (ed && t.status === 'AGUARDANDO_RETORNO') {
    h += '<div class="pend">⏳ Aguardando retorno.</div><div class="linha"><div><label>Referência do retorno</label><input id="ret-ref"></div>' +
      '<div style="flex:0 0 160px"><label>Data</label><input type="date" id="ret-data" value="' + hojeISO() + '"></div>' +
      '<div style="flex:0 0 auto;align-self:end"><button class="btn" data-acao="registrarRetorno">📥 Registrar retorno</button></div></div>';
  }
  return h + '</div>';
}

function bCotacoes(w, ed) {
  var cot = w.cotacoes || [];
  var h = '<div class="bloco"><h3>Cotações</h3>';
  h += cot.length ? '<table><tr><th>Item</th><th>Fornecedor</th><th>Fonte</th><th>Data</th><th class="num">Qtd</th><th class="num">Valor unit.</th><th>Considerada</th><th></th></tr>' +
    cot.map(function (c) {
      return '<tr><td>' + esc(c.item) + (c.descricao ? '<br><span class="ajuda">' + esc(c.descricao) + '</span>' : '') + '</td><td>' + esc(c.fornecedor) +
        (c.cnpj ? '<br><span class="ajuda">' + esc(c.cnpj) + '</span>' : '') + '</td><td>' + esc(c.fonte) + '</td><td>' + dataBR(c.dataCotacao) + '</td>' +
        '<td class="num">' + esc(c.quantidade) + ' ' + esc(c.unidade) + '</td><td class="num">' + brl(c.valorUnitario) + '</td>' +
        '<td>' + (ed ? '<input type="checkbox" data-acao="toggleCotacao" data-id="' + esc(c.id) + '"' + (c.considerado ? ' checked' : '') + '>' : (c.considerado ? 'Sim' : 'Não')) + '</td>' +
        '<td>' + (ed ? '<button class="btn sec peq" data-acao="removerCotacao" data-id="' + esc(c.id) + '">Excluir</button>' : '') + '</td></tr>';
    }).join('') + '</table>' : '<div class="vazio">Nenhuma cotação registrada.</div>';
  if (ed) {
    h += '<details style="margin-top:10px"' + (cot.length ? '' : ' open') + '><summary><b>+ Registrar cotação</b></summary><div id="form-cot">' +
      '<div class="linha"><div><label>Item <span class="obrig">*</span></label><input name="item" list="lista-itens" placeholder="Mesmo nome agrupa as cotações"></div>' +
      '<div><label>Descrição</label><input name="descricao"></div></div>' +
      '<datalist id="lista-itens">' + Array.from(new Set(cot.map(function (c) { return c.item; }))).map(function (i) { return '<option value="' + esc(i) + '">'; }).join('') + '</datalist>' +
      '<div class="linha"><div><label>Unidade</label><input name="unidade" placeholder="UST, mês, un"></div><div><label>Quantidade</label><input type="number" name="quantidade" value="1"></div>' +
      '<div><label>Valor unitário (R$) <span class="obrig">*</span></label><input type="number" step="0.01" name="valorUnitario"></div></div>' +
      '<div class="linha"><div><label>Fonte</label><select name="fonte">' + (w.fontes || []).map(function (f) { return '<option>' + esc(f) + '</option>'; }).join('') + '</select></div>' +
      '<div><label>Fornecedor / órgão</label><input name="fornecedor"></div><div><label>CNPJ</label><input name="cnpj"></div></div>' +
      '<div class="linha"><div><label>Data da cotação</label><input type="date" name="dataCotacao"></div><div><label>Referência (link, nº contrato, ata)</label><input name="referencia"></div></div>' +
      '<div class="acoes" style="margin-top:10px"><button class="btn" data-acao="salvarCotacao">Adicionar cotação</button></div></div></details>';
  }
  return h + '</div>';
}

function bMapa(w, ed) {
  var m = w.mapa;
  var h = '<div class="bloco"><h3><span>Mapa comparativo</span><span class="acoes">' +
    '<select id="mapa-metodo" data-change="metodoMapa" style="width:auto">' + Object.keys(S.ctx.metodosMapa).map(function (k) {
      return '<option value="' + k + '"' + (k === m.metodo ? ' selected' : '') + '>' + esc(S.ctx.metodosMapa[k]) + '</option>';
    }).join('') + '</select>' +
    (ed ? '<button class="btn peq" data-acao="gerarMapa">📊 Gerar documento do mapa</button>' : '') + '</span></h3>';
  if (!m.itens.length) return h + '<div class="vazio">Nenhuma cotação registrada na etapa de pesquisa de preços.</div></div>';
  h += '<p class="ajuda">Valores com variação maior que ' + Math.round(m.limiteDesvio * 100) + '% em relação à mediana aparecem em vermelho. Desmarque-os na pesquisa de preços se forem descartados.</p>';
  m.itens.forEach(function (i) {
    h += '<h3 style="margin-top:12px">' + esc(i.item) + (i.descricao ? ' — <span class="ajuda">' + esc(i.descricao) + '</span>' : '') + '</h3>' +
      '<table><tr><th>Fornecedor</th><th>Fonte</th><th class="num">Valor unitário</th><th>Considerada</th></tr>' + i.cotacoes.map(function (c) {
        return '<tr><td>' + esc(c.fornecedor) + '</td><td>' + esc(c.fonte) + '</td><td class="num ' + (c.destoante ? 'destoante' : '') + '">' + brl(c.valorUnitario) +
          (c.destoante ? ' ⚠' : '') + '</td><td>' + (c.considerado ? 'Sim' : 'Não') + '</td></tr>';
      }).join('') + '</table>' +
      '<table style="margin-top:6px"><tr><th>Nº</th><th class="num">Menor</th><th class="num">Média</th><th class="num">Mediana</th><th class="num">CV</th><th class="num">Unit. estimado</th><th class="num">Qtd</th><th class="num">Total</th></tr>' +
      '<tr><td>' + i.n + '</td><td class="num">' + brl(i.menor) + '</td><td class="num">' + brl(i.media) + '</td><td class="num">' + brl(i.mediana) + '</td>' +
      '<td class="num">' + (i.coefVariacao * 100).toFixed(1) + '%</td><td class="num"><b>' + brl(i.valorUnitarioEstimado) + '</b></td><td class="num">' + esc(i.quantidade) +
      '</td><td class="num"><b>' + brl(i.valorTotalEstimado) + '</b></td></tr></table>';
  });
  return h + '<h2 style="margin-top:14px">Valor total estimado: ' + brl(m.total) + '</h2></div>';
}

function bInstrucao(w) {
  var l = w.instrucao || [];
  return '<div class="bloco"><h3>Instrução processual — documentos</h3><table><tr><th></th><th>Documento</th><th>Situação</th></tr>' +
    l.map(function (i) {
      var ico = !i.exigido ? '➖' : i.ok ? '✅' : '❌';
      var sit = !i.exigido ? 'Não aplicável (' + esc(i.condicao) + ')' : i.ok ? 'OK' : (i.qtd ? 'Existe, mas nenhum marcado como FINAL' : 'Faltando');
      return '<tr><td>' + ico + '</td><td>' + esc(i.nome) + '</td><td>' + sit + '</td></tr>';
    }).join('') + '</table><p class="ajuda">Anexe os documentos faltantes no bloco Documentos abaixo, escolhendo o tipo correspondente.</p></div>';
}

// ---------- aba Documentos
function abaDocumentos(alvo) {
  var ed = podeEditar() && S.det.processo.status === 'EM_ANDAMENTO';
  alvo.innerHTML = '<div class="card"><h2>Documentos do processo</h2>' + tabelaDocs(S.det.documentos, ed, S.det.assinaturas) +
    (ed ? '<h3 style="margin-top:16px">Anexar documento</h3>' + formAnexo('dp', 'OUTRO') : '') + '</div>';
}

// ---------- aba Diligências
function abaDiligencias(alvo) {
  var ed = podeEditar();
  var l = S.det.diligencias;
  alvo.innerHTML = '<div class="card"><h2>Diligências / despachos</h2>' + (l.length ? l.map(function (d) {
    return '<div class="bloco"><h3><span>' + esc(d.numeroDespacho) + (d.origem ? ' — ' + esc(d.origem) : '') + '</span>' +
      tag(d.status === 'ABERTA' ? 'AGUARDANDO_RETORNO' : 'RESPONDIDA', d.status === 'ABERTA' ? 'Aberta' : 'Respondida') + '</h3>' +
      '<div class="meta">Recebido em ' + dataBR(d.recebidoEm) + ' · Prazo: ' + dataBR(d.prazo) + (d.respondidoEm ? ' · Respondido em ' + dataBR(d.respondidoEm) : '') + '</div>' +
      (d.assunto ? '<p>' + esc(d.assunto) + '</p>' : '') + (d.resposta ? '<p><b>Resposta:</b> ' + esc(d.resposta) + '</p>' : '') +
      (ed && d.status === 'ABERTA' ? '<div class="linha"><div><label>Resumo da resposta</label><input id="resp-' + esc(d.id) + '"></div>' +
        '<div><label>Documento de resposta (opcional)</label><input type="file" id="resparq-' + esc(d.id) + '"></div>' +
        '<div style="flex:0 0 auto;align-self:end"><button class="btn" data-acao="responderDiligencia" data-id="' + esc(d.id) + '">Registrar resposta</button></div></div>' : '') + '</div>';
  }).join('') : '<div class="vazio">Nenhuma diligência registrada.</div>') +
  (ed ? '<h3 style="margin-top:16px">Registrar nova diligência</h3><div id="form-dil"><div class="linha">' +
    '<div><label>Nº do despacho <span class="obrig">*</span></label><input name="numeroDespacho" placeholder="DESPACHO Nº 458/2026/CECOC"></div>' +
    '<div><label>Origem</label><input name="origem" placeholder="CECOC"></div></div>' +
    '<label>Assunto</label><textarea name="assunto"></textarea><div class="linha">' +
    '<div><label>Recebido em</label><input type="date" name="recebidoEm" value="' + hojeISO() + '"></div><div><label>Prazo</label><input type="date" name="prazo"></div></div>' +
    '<div class="acoes" style="margin-top:10px"><button class="btn" data-acao="registrarDiligencia">Registrar diligência</button></div></div>' : '') + '</div>';
}

// ---------- aba Dados
function abaDados(alvo) {
  var p = S.det.processo;
  var ed = podeEditar();
  var dis = ed ? '' : ' disabled';
  var vars = S.det.variaveis;
  var chaves = Object.keys(vars).filter(function (k) { return k.indexOf('checklist.') !== 0; }).sort();
  alvo.innerHTML = '<div class="grid g2"><div class="card" id="form-dados"><h2>Dados do processo</h2>' +
    '<label>Título</label><input name="titulo" value="' + esc(p.titulo) + '"' + dis + '>' +
    '<label>Objeto</label><textarea name="objeto"' + dis + '>' + esc(p.objeto) + '</textarea>' +
    '<div class="linha"><div><label>Nº SUITE</label><input name="numeroSuite" value="' + esc(p.numeroSuite) + '"' + dis + '></div>' +
    '<div><label>Setor demandante</label><input name="setorDemandante" value="' + esc(p.setorDemandante) + '"' + dis + '></div></div>' +
    '<div class="linha"><div><label>Analista responsável</label><select name="responsavelEmail"' + dis + '>' + opcoesUsuarios(p.responsavelEmail) + '</select></div>' +
    '<div><label>Responsável técnico</label><input name="responsavelTecnico" list="lista-resp-tecnico" value="' + esc(p.responsavelTecnico) + '"' + dis + '></div></div>' +
    datalistUsuarios() +
    '<p class="ajuda">Criado em ' + dataBR(p.criadoEm) + ' por ' + esc(nomeUsuario(p.criadoPor)) + '</p>' +
    (ed ? '<button class="btn" data-acao="salvarProcesso">Salvar</button>' : '') + '</div>' +
    '<div class="card"><h2>Informações registradas nas etapas</h2>' + (chaves.length ? '<table><tr><th>Campo</th><th>Valor</th></tr>' +
      chaves.map(function (k) { return '<tr><td>' + esc(k) + '</td><td>' + esc(vars[k]) + '</td></tr>'; }).join('') + '</table>' : '<div class="vazio">Nenhuma.</div>') +
    '</div></div>';
}

// ---------- aba Histórico
function abaHistorico(alvo) {
  alvo.innerHTML = '<div class="card"><h2>Histórico (auditoria)</h2><table><tr><th>Data/hora</th><th>Usuário</th><th>Ação</th><th>Detalhe</th></tr>' +
    S.det.historico.map(function (h) {
      return '<tr><td>' + dataBR(h.dataHora) + '</td><td>' + esc(nomeUsuario(h.usuario)) + '</td><td>' + esc(h.acao) + '</td><td>' + esc(h.detalhe) + '</td></tr>';
    }).join('') + '</table></div>';
}

// ------------------------------------------------------------------ ADMIN
function vAdmin() {
  return api('listarUsuarios').then(function (us) {
    app('<h1>Administração</h1><div class="grid g2"><div class="card"><h2>Usuários</h2><table><tr><th>E-mail</th><th>Nome</th><th>Setor</th><th>Papel</th><th>Ativo</th></tr>' +
      us.map(function (u) {
        return '<tr class="clicavel" data-acao="editarUsuario" data-email="' + esc(u.email) + '"><td>' + esc(u.email) + '</td><td>' + esc(u.nome) + '</td><td>' + esc(u.setor) +
          '</td><td>' + esc(u.papel) + '</td><td>' + (u.ativo ? 'Sim' : 'Não') + '</td></tr>';
      }).join('') + '</table>' +
      '<h3 style="margin-top:16px">Incluir / alterar usuário</h3><div id="form-usu"><div class="linha"><div><label>E-mail</label><input name="email"></div><div><label>Nome</label><input name="nome"></div></div>' +
      '<div class="linha"><div><label>Setor</label><input name="setor"></div><div><label>Papel</label><select name="papel">' +
      ['ANALISTA', 'GESTOR', 'CONSULTA', 'ADMIN'].map(function (p) { return '<option>' + p + '</option>'; }).join('') + '</select></div>' +
      '<div style="flex:0 0 80px"><label>Ativo</label><input type="checkbox" name="ativo" checked></div></div>' +
      '<div class="acoes" style="margin-top:10px"><button class="btn" data-acao="salvarUsuario">Salvar usuário</button></div></div></div>' +
      '<div class="card"><h2>Configuração do fluxo</h2><p>O fluxo (etapas, transições, campos, checklists, tipos de documento, pastas e modelos) é mantido nas abas <b>cfg_*</b> da planilha do banco de dados.</p>' +
      '<p class="acoes"><a class="btn sec" target="_blank" href="' + esc(S.ctx.dbUrl) + '">Abrir planilha (banco de dados)</a>' +
      '<a class="btn sec" target="_blank" href="' + esc(S.ctx.pastaRaizUrl) + '">Abrir pasta raiz</a></p>' +
      '<p>Depois de editar a configuração, clique em:</p><button class="btn" data-acao="recarregarConfig">🔄 Recarregar configuração</button>' +
      '<p class="ajuda">Versão ' + esc(S.ctx.versao) + '</p></div></div>');
  });
}

// ------------------------------------------------------------------ AÇÕES (cliques)
function recarregarProcesso(msg) {
  return vProcesso().then(function () {
    Rotas.atualizar(true);
    if (msg) toast(msg);
  });
}

var ACOES = {
  ir: function (d) { if (d.view === 'processos') S.filtro = null; ir(d.view); },
  abrirProcesso: function (d) { abrirProcesso(d.proc, null, d.aba); },
  abrirTarefa: function (d) { abrirProcesso(d.proc, d.tarefa, 'fluxo'); },
  aba: function (d) {
    S.aba = d.aba;
    $$('.abas a').forEach(function (a) { a.classList.toggle('ativo', a.dataset.aba === d.aba); });
    Promise.resolve(renderAba()).then(function () { Rotas.atualizar(); });
  },
  selTarefa: function (d) { carregarTarefa(d.tarefa).then(function () { Rotas.atualizar(); }); },
  filtrar: function () { S.filtro = { texto: $('#f-texto').value, status: $('#f-status').value }; ir('processos'); },

  criarProcesso: function () {
    var v = valoresForm($('#form-novo'));
    ocupado(api('criarProcesso', v), 'Processo criado.').then(function (p) {
      abrirProcesso(p.id);
    });
  },
  statusProcesso: function (d) {
    var motivo = prompt('Motivo para "' + (ROTULOS[d.status] || d.status) + '":');
    if (!motivo) return;
    ocupado(api('alterarStatusProcesso', S.procId, d.status, motivo), 'Status alterado.').then(function () { recarregarProcesso(); });
  },
  salvarProcesso: function () {
    ocupado(api('atualizarProcesso', S.procId, valoresForm($('#form-dados'))), 'Dados salvos.').then(function () { recarregarProcesso(); });
  },

  salvarCampos: function (d) {
    var v = valoresForm($(d.raiz));
    ocupado(api('salvarCampos', S.tarefaId, v), 'Dados salvos.').then(function () { carregarTarefa(S.tarefaId); });
  },
  checklist: function (d, el) {
    ocupado(api('marcarChecklist', S.tarefaId, d.item, el.checked)).then(function () { carregarTarefa(S.tarefaId); });
  },
  registrarEnvio: function () {
    ocupado(api('registrarEnvio', S.tarefaId, $('#env-ref').value, $('#env-data').value), 'Envio registrado.').then(function () { recarregarProcesso(); });
  },
  registrarRetorno: function () {
    ocupado(api('registrarRetorno', S.tarefaId, $('#ret-ref').value, $('#ret-data').value), 'Retorno registrado.').then(function () { recarregarProcesso(); });
  },
  concluir: function () {
    if (!confirm('Concluir a etapa "' + S.tar.etapa.nome + '"?')) return;
    ocupado(api('concluirTarefa', S.tarefaId, $('#obs-concluir').value), 'Etapa concluída.').then(function () {
      S.tarefaId = null;
      recarregarProcesso();
    });
  },
  devolver: function () {
    var destino = $('#dev-destino').value, motivo = $('#dev-motivo').value;
    if (!motivo) return toast('Informe o motivo da devolução.', true);
    if (!confirm('Devolver o processo para a etapa selecionada?')) return;
    ocupado(api('devolverTarefa', S.tarefaId, destino, motivo), 'Etapa devolvida.').then(function () {
      S.tarefaId = null;
      recarregarProcesso();
    });
  },

  gerarDoc: function (d) {
    ocupado(api('gerarDocumento', S.procId, d.tipo, S.tarefaId), 'Documento gerado. Abra-o para editar.').then(function (doc) {
      window.open(doc.url, '_blank');
      carregarTarefa(S.tarefaId);
    });
  },
  anexar: function (d) {
    var p = d.prefixo;
    var noFluxo = p === 'wt';
    lerArquivo($('#' + p + '-arq')).then(function (arq) {
      return ocupado(api('anexarDocumento', S.procId, $('#' + p + '-tipo').value, noFluxo ? S.tarefaId : '', arq), 'Documento anexado.');
    }).then(function () { noFluxo ? carregarTarefa(S.tarefaId) : recarregarProcesso(); })
      .catch(function (e) { toast(e.message, true); });
  },
  vincular: function (d) {
    var p = d.prefixo;
    var noFluxo = p === 'wt';
    var link = $('#' + p + '-link').value;
    if (!link) return toast('Informe o link do arquivo.', true);
    var mover = confirm('Mover o arquivo para a pasta do processo?\n(OK = mover, Cancelar = apenas vincular)');
    ocupado(api('vincularDocumento', S.procId, $('#' + p + '-tipo').value, noFluxo ? S.tarefaId : '', link, mover), 'Documento vinculado.')
      .then(function () { noFluxo ? carregarTarefa(S.tarefaId) : recarregarProcesso(); });
  },
  enviarAssinatura: function (d) {
    if (!confirm('Gerar o PDF e abrir o controle de assinaturas no SUITE?\nDepois de juntar o PDF ao SUITE, registre aqui cada assinatura.')) return;
    ocupado(api('enviarParaAssinatura', d.doc), 'PDF gerado. Junte-o ao SUITE para assinatura.').then(function () {
      S.aba === 'fluxo' ? carregarTarefa(S.tarefaId) : recarregarProcesso();
    });
  },
  registrarAssinatura: function (d) {
    var data = prompt('Data da assinatura no SUITE (dd/mm/aaaa):', new Date().toLocaleDateString('pt-BR'));
    if (data === null) return;
    var m = String(data).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!m) return toast('Data inválida. Use dd/mm/aaaa.', true);
    ocupado(api('registrarAssinatura', d.id, m[3] + '-' + m[2] + '-' + m[1]), 'Assinatura registrada.').then(function () {
      S.aba === 'fluxo' ? carregarTarefa(S.tarefaId) : recarregarProcesso();
    });
  },
  usarSugestao: function (d) {
    var s = S.tar.sugestoes[d.campo];
    var el = $('#bloco-form [name="' + d.campo + '"]');
    if (!s || !el) return;
    el.value = s.valor;
    el.focus();
    toast('Sugestão aplicada. Revise e clique em "Salvar dados".');
  },
  expandirSecoes: function () {
    var secoes = $$('#bloco-form details.secao');
    var abrir = secoes.some(function (x) { return !x.open; });
    secoes.forEach(function (x) { x.open = abrir; });
  },
  statusDoc: function (d) {
    ocupado(api('alterarStatusDocumento', d.doc, d.status), 'Status do documento alterado.').then(function () {
      S.aba === 'fluxo' ? carregarTarefa(S.tarefaId) : recarregarProcesso();
    });
  },

  salvarCotacao: function () {
    ocupado(api('salvarCotacao', S.procId, valoresForm($('#form-cot'))), 'Cotação registrada.').then(function () { carregarTarefa(S.tarefaId); });
  },
  removerCotacao: function (d) {
    if (!confirm('Excluir esta cotação?')) return;
    ocupado(api('removerCotacao', d.id), 'Cotação excluída.').then(function () { carregarTarefa(S.tarefaId); });
  },
  toggleCotacao: function (d, el) {
    var c = S.tar.cotacoes.filter(function (x) { return x.id === d.id; })[0];
    c.considerado = el.checked;
    ocupado(api('salvarCotacao', S.procId, c)).then(function () { carregarTarefa(S.tarefaId); });
  },
  gerarMapa: function () {
    ocupado(api('gerarMapa', S.procId, $('#mapa-metodo').value, S.tarefaId), 'Mapa comparativo gerado.').then(function (doc) {
      window.open(doc.url, '_blank');
      carregarTarefa(S.tarefaId);
    });
  },

  registrarDiligencia: function () {
    ocupado(api('registrarDiligencia', S.procId, valoresForm($('#form-dil'))), 'Diligência registrada.').then(function () { recarregarProcesso(); });
  },
  responderDiligencia: function (d) {
    var resposta = $('#resp-' + d.id).value;
    var input = $('#resparq-' + d.id);
    var envio = input.files && input.files[0]
      ? lerArquivo(input).then(function (arq) { return api('anexarDocumento', S.procId, 'RESPOSTA_DESPACHO', '', arq); }).then(function (doc) { return doc.id; })
      : Promise.resolve('');
    ocupado(envio.then(function (docId) { return api('responderDiligencia', d.id, resposta, docId); }), 'Resposta registrada.')
      .then(function () { recarregarProcesso(); });
  },

  editarUsuario: function (d) {
    api('listarUsuarios').then(function (us) {
      var u = us.filter(function (x) { return x.email === d.email; })[0];
      var f = $('#form-usu');
      ['email', 'nome', 'setor', 'papel'].forEach(function (k) { $('[name=' + k + ']', f).value = u[k] || ''; });
      $('[name=ativo]', f).checked = !!u.ativo;
    });
  },
  salvarUsuario: function () {
    ocupado(api('salvarUsuario', valoresForm($('#form-usu'))), 'Usuário salvo.').then(function () {
      return api('contexto').then(function (c) { S.ctx = c; ir('admin'); });
    });
  },
  recarregarConfig: function () {
    ocupado(api('recarregarConfig'), 'Configuração recarregada.').then(function () {
      return api('contexto').then(function (c) { S.ctx = c; });
    });
  }
};

var MUDANCAS = {
  nsa: function (el) {
    var area = el.closest('.secao-corpo').querySelector('textarea');
    area.placeholder = el.checked ? 'Justificativa do “Não se aplica”' : 'Texto da seção';
    if (el.checked) area.focus();
  },
  atribuir: function (el) {
    ocupado(api('atribuirTarefa', S.tarefaId, el.value), 'Analista responsável alterado.');
  },
  metodoMapa: function (el) {
    api('calcularMapa', S.procId, el.value).then(function (m) { S.tar.mapa = m; renderTrabalho(); });
  }
};

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-acao]');
  if (!el) return;
  if (el.type !== 'checkbox' && el.type !== 'radio') ev.preventDefault();
  var fn = ACOES[el.dataset.acao];
  if (fn) fn(el.dataset, el);
});
document.addEventListener('change', function (ev) {
  var el = ev.target.closest('[data-change]');
  if (el && MUDANCAS[el.dataset.change]) MUDANCAS[el.dataset.change](el);
});

// ------------------------------------------------------------------ início
api('contexto').then(function (ctx) {
  S.ctx = ctx;
  $('#app-nome').textContent = ctx.app;
  $('#usuario').textContent = ctx.usuario.nome + ' · ' + ctx.usuario.papel;
  if (ctx.usuario.papel === 'ADMIN') $('#menu-admin').classList.remove('oculto');
  Rotas.iniciar();
}).catch(function (e) {
  app('<div class="card"><h2>Não foi possível entrar</h2><p>' + esc(e.message) + '</p></div>');
});
</script>
