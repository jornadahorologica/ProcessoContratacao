<script>

var S = { ctx: null, view: 'painel', procId: null, tarefaId: null, aba: 'fluxo', det: null, tar: null };

// ------------------------------------------------------------------ utilitários
function chamar_(metodo, args, tela) {
  return new Promise(function (ok, falha) {
    google.script.run
      .withSuccessHandler(function (s) {
        var r = JSON.parse(s);
        if (r.ok) ok(r.data); else falha(new Error(r.erro));
      })
      .withFailureHandler(function (e) { falha(e instanceof Error ? e : new Error(String(e))); })
      .apiCall(metodo, args, tela || null);
  });
}
function api(metodo) {
  return chamar_(metodo, Array.prototype.slice.call(arguments, 1));
}
/**
 * Executa uma operação no processo aberto e recebe, na MESMA chamada, a tela
 * atualizada (processo + etapa). opcoes.auto = escolher a etapa atual (após concluir/devolver).
 */
function acaoTela(metodo, args, msgOk, opcoes) {
  var tela = { processoId: S.procId, tarefaId: opcoes && opcoes.auto ? null : S.tarefaId, aba: S.aba };
  return ocupado(chamar_(metodo, args, tela), msgOk).then(function (r) {
    aplicarTela(r.tela);
    Rotas.atualizar(true);
    return r.resultado;
  });
}
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function brl(v) {
  if (v === null || v === undefined || v === '') return '—';
  return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function dataBR(s) {
  if (!s) return '—';
  var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return esc(s);
  if (String(s).length > 10) {
    var d = new Date(s);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  return m[3] + '/' + m[2] + '/' + m[1];
}
function hojeISO() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }

  editar: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  anexo: '<path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.8 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  assinar: '<path d="M3 21h18"/><path d="M14.5 3.5a2.1 2.1 0 0 1 3 3L8 16l-4 1 1-4z"/>',
  grafico: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  lista: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  decisao: '<path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
  lixo: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  atualizar: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  lampada: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  balanca: '<path d="M12 3v18M5 21h14M7 7h10"/><path d="m3 13 4-6 4 6a4 4 0 0 1-8 0zM13 13l4-6 4 6a4 4 0 0 1-8 0z"/>',

function ic(nome, tam) {
  var t = tam || 18;
  return '<svg class="ic" width="' + t + '" height="' + t + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (SVG[nome] || SVG.info) + '</svg>';
}
/** Troca os marcadores <span data-ic="nome"> do HTML fixo pelos ícones. */
function aplicarIcones(raiz) {
  $$('[data-ic]', raiz).forEach(function (el) { el.innerHTML = ic(el.dataset.ic, Number(el.dataset.tam) || (el.classList.contains('selo') ? 20 : 18)); });
}
function pontoStatus(st) { return '<span class="ponto ' + esc(st) + '"></span>'; }
function nomeFase(cod) {
  var f = (S.ctx.fases || []).filter(function (x) { return x.codigo === cod; })[0];
  return f ? f.nome : (cod || '—');
}
function nomeUsuario(email) {
  var u = (S.ctx.usuarios || []).filter(function (x) { return x.email === email; })[0];
  return u ? (u.nome || u.email) : (email || '—');
}
function nomeTipoDoc(cod) {
  var t = (S.ctx.tiposDocumento || []).filter(function (x) { return x.codigo === cod; })[0];
  return t ? t.nome : cod;
}
function podeEditar() { return S.ctx.usuario.papel !== 'CONSULTA'; }
function ehGestor() { return S.ctx.usuario.papel === 'ADMIN' || S.ctx.usuario.papel === 'GESTOR'; }
function opcoesUsuarios(sel) {
  return S.ctx.usuarios.map(function (u) {

  }).join('');
}
/** Sugestões para o campo "Responsável técnico" (texto livre): padrão + nomes dos usuários. */
function datalistUsuarios() {
  var nomes = [S.ctx.responsavelTecnicoPadrao].concat(S.ctx.usuarios.map(function (u) { return u.nome; }))
    .filter(function (n, i, arr) { return n && arr.indexOf(n) === i; });
  return '<datalist id="lista-resp-tecnico">' + nomes.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>';

function opcoesTiposDoc(sel) {

/** Aviso no canto superior direito. toast(mensagem, erro?, título?) */
function toast(msg, erro, titulo) {
  var el = document.createElement('div');
  el.className = 'toast' + (erro ? ' erro' : '');
  el.setAttribute('role', erro ? 'alert' : 'status');
  el.innerHTML = '<div class="ib">' + ic(erro ? 'alerta' : 'check', 16) + '</div><div><b>' + esc(titulo || (erro ? 'Não foi possível concluir' : msg)) + '</b>' +
    (titulo || erro ? '<span class="m">' + esc(msg) + '</span>' : '') + '</div>';
  var pilha = $('#toasts');
  pilha.appendChild(el);
  while (pilha.children.length > 3) pilha.removeChild(pilha.firstChild); // no máximo 3 avisos visíveis
  setTimeout(function () {
    el.classList.add('saindo');
    setTimeout(function () { el.remove(); }, 260);
  }, erro ? 8000 : 3500);
}
function ocupado(promessa, msgOk) {
  $('#ocupado').classList.remove('oculto');
  return promessa.then(function (r) {
    if (msgOk) toast(msgOk);
    return r;
  }).catch(function (e) {
    toast(e.message, true);
    throw e;
  }).finally(function () { $('#ocupado').classList.add('oculto'); });
}

/**
 * Pop-ups do sistema (substituem confirm/prompt do navegador).
 * Dialogo.abrir({tipo: 'sucesso'|'perigo'|'aviso'|'', icone, titulo, texto, detalhe (HTML),
 *   campo: {tipo: 'text'|'date'|'textarea', rotulo, valor, placeholder, obrigatorio},
 *   ok, cancelar, classeOk, iconeOk, botoes: [{rotulo, valor, classe, icone}]})
 * Resolve com: true/false; o texto do campo (ou null); ou o "valor" do botão clicado (null = fechado).
 */
var Dialogo = {
  abrir: function (o) {
    return new Promise(function (resolve) {
      var v = $('#dialogo');
      var botoes = o.botoes || [
        { rotulo: o.cancelar || 'Cancelar', valor: false, classe: 'sec' },
        { rotulo: o.ok || 'Confirmar', valor: true, classe: o.classeOk || '', icone: o.iconeOk }
      ];
      var campo = o.campo;
      v.innerHTML = '<div class="dlg ' + esc(o.tipo || '') + '" role="dialog" aria-modal="true" aria-labelledby="dlg-titulo">' +
        '<div class="top"><div class="ib">' + ic(o.icone || 'info', 24) + '</div><div><h3 id="dlg-titulo">' + esc(o.titulo) + '</h3>' +
        (o.texto ? '<p>' + esc(o.texto) + '</p>' : '') + '</div></div>' +
        (o.detalhe ? '<div class="detalhe">' + o.detalhe + '</div>' : '') +
        (campo ? '<div class="campo-dlg">' + (campo.rotulo ? '<label for="dlg-campo">' + esc(campo.rotulo) + (campo.obrigatorio ? ' <span class="obrig">*</span>' : '') + '</label>' : '') +
          (campo.tipo === 'textarea'
            ? '<textarea id="dlg-campo" placeholder="' + esc(campo.placeholder || '') + '">' + esc(campo.valor || '') + '</textarea>'
            : '<input id="dlg-campo" type="' + esc(campo.tipo || 'text') + '" value="' + esc(campo.valor || '') + '" placeholder="' + esc(campo.placeholder || '') + '">') + '</div>' : '') +
        '<div class="pe">' + botoes.map(function (b, i) {
          return '<button class="btn ' + esc(b.classe || '') + '" data-dlg="' + i + '">' + (b.icone ? ic(b.icone, 16) : '') + esc(b.rotulo) + '</button>';
        }).join('') + '</div></div>';
      v.classList.remove('oculto');
      var entrada = $('#dlg-campo');
      (entrada || $('[data-dlg="' + (botoes.length - 1) + '"]', v)).focus();
      var fechar = function (r) {
        v.classList.add('oculto');
        v.innerHTML = '';
        document.removeEventListener('keydown', tecla, true);
        resolve(r);
      };
      var escolher = function (i) {
        var b = botoes[i];
        if (campo) {
          if (b.valor !== true) return fechar(null);
          var val = entrada.value.trim();
          if (campo.obrigatorio && !val) { entrada.classList.add('campo-destacado'); entrada.focus(); return; }
          return fechar(val);
        }
        fechar(b.valor);
      };
      var tecla = function (ev) {
        if (ev.key === 'Escape') { ev.preventDefault(); fechar(campo || o.botoes ? null : false); }
        else if (ev.key === 'Enter' && !(entrada && entrada.tagName === 'TEXTAREA')) { ev.preventDefault(); escolher(botoes.length - 1); }
      };
      document.addEventListener('keydown', tecla, true);
      v.onclick = function (ev) {
        var b = ev.target.closest('[data-dlg]');
        if (b) escolher(Number(b.dataset.dlg));
        else if (ev.target === v) fechar(campo || o.botoes ? null : false);
      };
    });
  }
};

function migalhas(itens) {
  $('#migalhas').innerHTML = itens.map(function (x, i) {
    return i === itens.length - 1 ? '<b>' + esc(x[0]) + '</b>' : '<a href="' + esc(x[1]) + '" data-acao="ir" data-view="' + esc(x[2]) + '">' + esc(x[0]) + '</a><span>/</span>';
  }).join('');
}
function cabPagina(titulo, subtitulo, acoes) {
  return '<div class="cab-pagina"><div><h1>' + esc(titulo) + '</h1>' + (subtitulo ? '<p>' + subtitulo + '</p>' : '') + '</div>' +
    (acoes ? '<div class="acoes">' + acoes + '</div>' : '') + '</div>';
}
function cabBloco(icone, titulo, extra) {
  return '<h3><span><span class="ib">' + ic(icone, 16) + '</span>' + titulo + '</span>' + (extra || '') + '</h3>';
}
function diasEntre(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function iniciais(nome) {
  return String(nome || '?').split(/[\s.@_-]+/).filter(String).slice(0, 2).map(function (p) { return p[0].toUpperCase(); }).join('') || '?';
}
function lerArquivo(input) {
  return new Promise(function (ok, falha) {
    var f = input.files && input.files[0];
    if (!f) return falha(new Error('Selecione um arquivo.'));
    if (f.size > 40 * 1024 * 1024) return falha(new Error('Arquivo maior que 40 MB.'));
    var r = new FileReader();
    r.onload = function () { ok({ nome: f.name, mimeType: f.type, base64: String(r.result).split(',')[1] }); };
    r.onerror = function () { falha(new Error('Falha ao ler o arquivo.')); };
    r.readAsDataURL(f);
  });
}
function valoresForm(raiz) {
  var v = {};
  $$('[name]', raiz).forEach(function (el) {
    if (el.type === 'radio') { if (el.checked) v[el.name] = el.value; return; }
    if (el.type === 'checkbox') { v[el.name] = el.checked; return; }
    v[el.name] = el.value;
  });
  return v;
}
function app(html) { $('#app').innerHTML = html; }
/** Logos clicáveis dos sistemas externos configurados para a tela/etapa (APP.SISTEMAS_EXTERNOS). */
function logosExternos(tela) {
  return (S.ctx.sistemasExternos || []).filter(function (s) { return s.etapas.indexOf(tela) >= 0; }).map(function (s) {
    return '<a class="logo-externo" href="' + esc(s.url) + '" target="_blank" rel="noopener" title="Abrir o ' + esc(s.nome) + ' em nova aba">' +
      (s.logo ? '<img src="' + s.logo + '" alt="' + esc(s.nome) + '">' : '<span>Abrir ' + esc(s.nome) + ' ↗</span>') + '</a>';
  }).join('');
}

// ------------------------------------------------------------------ rotas (URL)
/*
 * A URL do Web App reflete a tela atual no fragmento (#). O Apps Script não
 * permite alterar o caminho da URL depois que a página carrega.
 *   …/exec#/painel
 *   …/exec#/processos
 *   …/exec#/novo-processo
 *   …/exec#/processo/CESOP-2026-001                (aba Fluxo, etapa atual)
 *   …/exec#/processo/CESOP-2026-001/etapa/DFD      (etapa específica)
 *   …/exec#/processo/CESOP-2026-001/documentos     (também diligencias, dados, historico)
 *   …/exec#/admin
 * Os links podem ser copiados/compartilhados e os botões Voltar/Avançar funcionam.
 */
var ABAS = ['fluxo', 'documentos', 'diligencias', 'dados', 'historico'];
var Rotas = {
  _atual: null,
  _historico: function () { return window.google && google.script && google.script.history; },

  /** Monta o fragmento a partir do estado atual. */
  montar: function () {
    switch (S.view) {
      case 'processos': return '/processos';
      case 'tarefas': return '/minhas-tarefas';
      case 'novo': return '/novo-processo';
      case 'admin': return '/admin';
      case 'processo': {
        var num = S.det && S.det.processo && S.det.processo.id === S.procId ? S.det.processo.numero : S.procId;
        var base = '/processo/' + encodeURIComponent(num);
        if (S.aba && S.aba !== 'fluxo') return base + '/' + S.aba;
        var cod = S.tar && S.tar.tarefa && S.tar.tarefa.id === S.tarefaId ? S.tar.tarefa.etapaCodigo : '';
        return base + (cod ? '/etapa/' + encodeURIComponent(cod) : '');
      }
      default: return '/painel';
    }
  },

  /** Interpreta um fragmento. Retorna {view, params} ou null se inválido. */
  ler: function (hash) {
    var partes = String(hash || '').replace(/^#/, '').split('/').filter(String).map(decodeURIComponent);
    var simples = { '': 'painel', painel: 'painel', processos: 'processos', 'minhas-tarefas': 'tarefas', 'novo-processo': 'novo', admin: 'admin' };
    if (partes.length <= 1 && simples.hasOwnProperty(partes[0] || '')) return { view: simples[partes[0] || ''], params: {} };
    if (partes[0] === 'processo' && partes[1]) {
      var p = { procId: partes[1], tarefaId: null, etapaRota: null, aba: 'fluxo' };
      if (partes[2] === 'etapa' && partes[3]) p.etapaRota = partes[3];
      else if (partes[2] && ABAS.indexOf(partes[2]) >= 0) p.aba = partes[2];
      return { view: 'processo', params: p };
    }
    return null;
  },

  /** Atualiza a URL se a tela mudou (substituir = não cria entrada no histórico). */
  atualizar: function (substituir) {
    var h = this.montar();
    if (h === this._atual) return;
    var primeira = this._atual === null;
    this._atual = h;
    var hist = this._historico();
    if (hist) hist[substituir || primeira ? 'replace' : 'push'](null, {}, h);
    else if (substituir || primeira) history.replaceState(null, '', '#' + h);
    else location.hash = h;
  },

  /** Abre a tela correspondente a um fragmento (carga inicial, Voltar/Avançar). */
  aplicar: function (hash) {
    var r = this.ler(hash);
    if (!r) { toast('Endereço não encontrado. Abrindo o painel.', true); r = { view: 'painel', params: {} }; }
    this._atual = String(hash || '').replace(/^#/, '') || null;
    return ir(r.view, r.params);
  },

  iniciar: function () {
    var self = this;
    var hist = this._historico();
    if (hist) {
      hist.setChangeHandler(function (e) { self.aplicar(e.location && e.location.hash); });
      google.script.url.getLocation(function (loc) { self.aplicar(loc.hash); });
    } else {
      window.addEventListener('popstate', function () { self.aplicar(location.hash); });
      self.aplicar(location.hash);
    }
  }
};

// ------------------------------------------------------------------ navegação
function ir(view, params) {
  S.view = view;
  S.autoSelecionada = false;
  if (view !== 'processo') { S.det = null; S.tar = null; }
  if (params) for (var k in params) S[k] = params[k];
  $$('#menu a').forEach(function (a) { a.classList.toggle('ativo', a.dataset.view === view); });
  app('<div class="carregando">Carregando…</div>');
  $$('#menu a').forEach(function (a) { a.classList.toggle('ativo', a.dataset.view === (view === 'processo' ? 'processos' : view)); });
  var r = { painel: vPainel, processos: vProcessos, tarefas: vTarefas, novo: vNovo, processo: vProcesso, admin: vAdmin }[view];
  return Promise.resolve(r()).then(function () {
    // Etapa escolhida automaticamente (etapa atual): substitui em vez de criar outra entrada no histórico
    Rotas.atualizar(view === 'processo' && S.autoSelecionada);
  }).catch(function (e) {
    app('<div class="card"><b>Erro:</b> ' + esc(e.message) + '</div>');
  });
}
function abrirProcesso(id, tarefaId, aba) {
  return ir('processo', { procId: id, tarefaId: tarefaId || null, etapaRota: null, aba: aba || 'fluxo' });
}

function vProcesso() {
  return api('telaProcesso', S.procId, { tarefaId: S.tarefaId, etapa: S.etapaRota, aba: S.aba }).then(aplicarTela);
}

/** Aplica a tela recebida do servidor (detalhe + etapa selecionada) sem nova chamada. */
function aplicarTela(tela) {
  S.det = tela.detalhe;
  S.procId = tela.detalhe.processo.id; // a URL pode trazer o número; daqui em diante usa o id interno
  S.tarefaId = tela.tarefaId;
  S.tar = tela.tarefa;
  S.autoSelecionada = tela.auto;
  if (tela.etapaNaoIniciada) toast('A etapa "' + tela.etapaNaoIniciada + '" ainda não foi iniciada neste processo.', true);
  S.etapaRota = null;
  renderProcesso();
  return renderAba();
}

function renderProcesso() {
  var det = S.det;
  var p = det.processo;
  migalhas([['Processos', '#/processos', 'processos'], [p.numero]]);
  var gestao = ehGestor() ? (
    p.status === 'EM_ANDAMENTO' ? '<button class="btn sec" data-acao="statusProcesso" data-status="SUSPENSO">Suspender</button>' +
      '<button class="btn perigo" data-acao="statusProcesso" data-status="CANCELADO">Cancelar</button>' :
    p.status === 'SUSPENSO' ? '<button class="btn" data-acao="statusProcesso" data-status="EM_ANDAMENTO">Retomar</button>' +
      '<button class="btn perigo" data-acao="statusProcesso" data-status="CANCELADO">Cancelar</button>' : '') : '';
  var meta = function (icone, rotulo, valor) {
    return '<div class="meta"><div class="ib">' + ic(icone, 16) + '</div><div style="min-width:0"><small>' + rotulo + '</small><b title="' + esc(valor) + '">' + esc(valor) + '</b></div></div>';
  };
  var dias = p.criadoEm ? diasEntre(p.criadoEm.slice(0, 10), hojeISO()) : 0;

  // Barra de fases: progresso de cada fase pelas etapas concluídas
  var fases = S.ctx.fases.filter(function (f) { return f.codigo !== 'CONCLUIDO'; });
  var idxAtual = fases.map(function (f) { return f.codigo; }).indexOf(p.fase);
  if (p.status === 'CONCLUIDO') idxAtual = fases.length;
  var barra = fases.map(function (f, i) {
    var et = det.linhaDoTempo.filter(function (e) { return e.fase === f.codigo; });
    var feitas = et.filter(function (e) { return e.status === 'CONCLUIDA'; }).length;
    var pct = i < idxAtual ? 100 : (et.length ? Math.round(100 * feitas / et.length) : 0);
    var cls = i === idxAtual ? 'atual' : i > idxAtual ? 'futura' : '';
    return '<div class="fase-b ' + cls + '" title="' + feitas + ' de ' + et.length + ' etapas concluídas"><div class="barra"><span style="width:' + pct + '%"></span></div>' +
      '<small>Fase ' + (i + 1) + (i === idxAtual ? ' · atual' : '') + '</small><b>' + esc(f.nome) + '</b></div>';
  }).join('');

  var abas = [['fluxo', 'Fluxo e etapas', 'lista'], ['documentos', 'Documentos', 'doc', det.documentos.length],
    ['diligencias', 'Diligências', 'balanca', det.diligencias.length], ['dados', 'Dados', 'editar'], ['historico', 'Histórico', 'atividade']];
  app('<div class="card proc"><div style="flex:1;min-width:0">' +
      '<span class="num-proc">' + ic('hash', 13) + esc(p.numero) + (p.numeroSuite ? ' · SUITE ' + esc(p.numeroSuite) : '') + '</span>' +
      '<h1>' + esc(p.titulo) + '</h1>' +
      '<div class="objeto">' + tag(p.status) + '<span>' + esc(p.objeto) + '</span></div>' +
      '<div class="metas">' + meta('usuario', 'Analista responsável', nomeUsuario(p.responsavelEmail)) +
      meta('escudo', 'Responsável técnico', p.responsavelTecnico || '—') +
      meta('dinheiro', 'Valor estimado', p.valorEstimado !== null && p.valorEstimado !== undefined && p.valorEstimado !== '' ? brl(p.valorEstimado) : 'A definir') +
      meta('calendario', 'Aberto há', dias + (dias === 1 ? ' dia' : ' dias')) + '</div></div>' +
      '<div class="acoes"><a class="btn sec" href="' + esc(p.pastaUrl) + '" target="_blank">' + ic('pasta', 16) + 'Drive</a>' + gestao + '</div></div>' +
    '<div class="card fases">' + barra + '</div>' +
    '<div class="abas">' + abas.map(function (a) {
      return '<a href="#" data-acao="aba" data-aba="' + a[0] + '" class="' + (S.aba === a[0] ? 'ativo' : '') + '">' + ic(a[2], 15) + a[1] +
        (a[3] !== undefined ? '<span class="qtd">' + a[3] + '</span>' : '') + '</a>';
    }).join('') + '</div><div id="conteudo-aba"></div>');
}

function renderAba() {
  var alvo = $('#conteudo-aba');
  var r = { fluxo: abaFluxo, documentos: abaDocumentos, diligencias: abaDiligencias, dados: abaDados, historico: abaHistorico }[S.aba];
  return Promise.resolve(r(alvo));
}

// ---------- aba Fluxo: linha do tempo + área de trabalho da etapa
function abaFluxo(alvo) {
  var det = S.det;
  var porFase = [];
  det.linhaDoTempo.forEach(function (e) {
    var g = porFase[porFase.length - 1];
    if (!g || g.fase !== e.fase) porFase.push(g = { fase: e.fase, itens: [] });
    g.itens.push(e);
  });
  var n = 0;
  var sub = function (e) {
    if (e.status === 'CONCLUIDA') return 'Concluída' + (e.concluidaEm ? ' em ' + dataBR(e.concluidaEm.slice(0, 10)) : '');
    if (e.status === 'ABERTA') return 'Em andamento' + (e.prazo ? ' · prazo ' + dataBR(e.prazo) : '');
    if (e.status === 'AGUARDANDO_RETORNO') return 'Aguardando retorno';
    if (e.status === 'NAO_INICIADA') return 'Não iniciada';
    return ROTULOS[e.status] || e.status;
  };
  var tl = porFase.map(function (g) {
    return '<div class="fase">' + esc(nomeFase(g.fase)) + '</div>' + g.itens.map(function (e, i) {
      n++;
      var clic = e.tarefaId ? ' data-acao="selTarefa" data-tarefa="' + esc(e.tarefaId) + '"' : '';
      return '<div class="item ' + esc(e.status) + (e.tarefaId ? '' : ' inativo') + (e.tarefaId && e.tarefaId === S.tarefaId ? ' sel' : '') +
        (i === g.itens.length - 1 ? ' ultimo' : '') + '"' + clic + '>' +
        '<span class="bola">' + (e.status === 'CONCLUIDA' ? ic('check', 14) : n) + '</span>' +
        '<span class="txt"><b>' + esc(e.nome) + (e.instancias > 1 ? ' <span class="ajuda">(' + e.instancias + 'x)</span>' : '') + '</b><small>' + sub(e) + '</small></span></div>';
    }).join('');
  }).join('');
  alvo.innerHTML = '<div class="fluxo"><div class="card timeline"><h2>Etapas</h2>' + tl + '</div>' +
    '<div id="area-trabalho">' + (S.tarefaId ? '<div class="carregando">Carregando etapa…</div>' : '<div class="card vazio">Selecione uma etapa.</div>') + '</div></div>';
  if (!S.tarefaId) return;
  if (S.tar && S.tar.tarefa && S.tar.tarefa.id === S.tarefaId) return renderTrabalho(); // já veio na resposta
  return carregarTarefa(S.tarefaId);
}

function carregarTarefa(id) {
  S.tarefaId = id;
  $$('.timeline .item').forEach(function (el) { el.classList.toggle('sel', el.dataset.tarefa === id); });
  return api('abrirTarefa', id).then(function (w) { S.tar = w; renderTrabalho(); })
    .catch(function (e) { $('#area-trabalho').innerHTML = '<div class="card">Erro: ' + esc(e.message) + '</div>'; });
}

/** Para onde leva cada pendência (bloco da tela e, se houver, o campo). */
function alvoPendencia(txt) {
  var m = txt.match(/(?:seção|campo) "(.+?)"/) || txt.match(/"Não se aplica" em: (.+)$/);
  if (m) return { bloco: 'bloco-form', rotulo: m[1], acao: 'Preencher' };
  if (/decisão/i.test(txt)) return { bloco: 'bloco-decisao', acao: 'Decidir' };
  if (/checklist/i.test(txt)) return { bloco: 'bloco-check', acao: 'Marcar' };
  if (/instrução/i.test(txt)) return { bloco: 'bloco-instr', acao: 'Ver' };
  if (/envio e o retorno/i.test(txt)) return { bloco: 'bloco-solic', acao: 'Registrar' };
  if (/cotação/i.test(txt)) return { bloco: 'bloco-cot', acao: 'Registrar' };
  if (/documento|assinad/i.test(txt)) return { bloco: 'bloco-docs', acao: 'Documentos' };
  return null;
}

function renderTrabalho() {
  var w = S.tar, t = w.tarefa, e = w.etapa;
  var ed = w.ativa && podeEditar();
  var concluida = t.status === 'CONCLUIDA';
  var icone = e.tipo === 'DECISAO' ? 'decisao' : w.blocos.indexOf('D') >= 0 ? 'enviar' : w.blocos.indexOf('E') >= 0 || w.blocos.indexOf('M') >= 0 ? 'grafico' :
    w.blocos.indexOf('I') >= 0 ? 'tarefas' : 'doc';
  var chips = [tag(t.status)];
  if (t.prazo && w.ativa) {
    var d = diasEntre(hojeISO(), t.prazo);
    chips.push('<span class="chip ' + (d < 0 ? 'vermelho' : d <= 2 ? 'ambar' : '') + '">' + ic('relogio', 13) +
      (d < 0 ? 'Atrasada há ' + (-d) + ' dia(s)' : d === 0 ? 'Vence hoje' : 'Prazo em ' + d + ' dia(s) · ' + dataBR(t.prazo)) + '</span>');
  }
  if (t.setor) chips.push('<span class="chip">' + ic('usuario', 13) + esc(t.setor) + '</span>');
  if (t.concluidaEm) chips.push('<span class="chip verde">' + ic('check', 13) + 'Encerrada em ' + dataBR(t.concluidaEm) + ' por ' + esc(nomeUsuario(t.concluidaPor)) + '</span>');

  var cab = '<div class="card"><div class="topo-etapa' + (concluida ? ' concluida' : '') + '"><div class="ib">' + ic(concluida ? 'check' : icone, 22) + '</div>' +
    '<div style="flex:1;min-width:0"><h2>' + esc(e.nome) + '</h2>' + (e.descricao ? '<p>' + esc(e.descricao) + '</p>' : '') +
    '<div class="chips">' + chips.join('') + '</div>' +
    (t.observacao ? '<p style="margin-top:10px">' + ic('editar', 14) + ' ' + esc(t.observacao) + '</p>' : '') + '</div>' +
    '<div class="lado">' + (logosExternos(e.codigo) ? '<div class="logos-externos">' + logosExternos(e.codigo) + '</div>' : '') +
    '<label>Analista responsável</label>' +
    (ed ? '<select id="sel-resp" data-change="atribuir">' + opcoesUsuarios(t.responsavelEmail) + '</select>' : '<div class="chip">' + esc(nomeUsuario(t.responsavelEmail)) + '</div>') +
    '</div></div></div>';

  var pend = '';
  if (w.ativa) {
    pend = w.pendencias.length
      ? '<div class="pend"><div class="cab">' + ic('alerta', 18) + 'Para concluir esta etapa<span class="qtd">' + w.pendencias.length + ' pendência(s)</span></div><ul>' +
        w.pendencias.map(function (x, i) {
          var alvo = alvoPendencia(x);
          return '<li><span class="c"></span><span>' + esc(x) + '</span>' +
            (alvo ? '<a href="#" data-acao="irPendencia" data-i="' + i + '">' + alvo.acao + ' →</a>' : '') + '</li>';
        }).join('') + '</ul></div>'
      : '<div class="ok-box">' + ic('check', 18) + 'Tudo pronto! A etapa pode ser concluída.</div>';
  }

  var html = { A: bFormulario, B: bDocumentos, C: bChecklist, D: bSolicitacao, E: bCotacoes, F: bDecisao, I: bInstrucao, M: bMapa };
  var blocos = w.blocos.map(function (b) { return html[b] ? html[b](w, ed) : ''; }).join('');

  var rodape = '';
  if (ed) {
    rodape = '<div class="card"><div class="rodape-etapa"><div class="obs"><label>Observação ao concluir (opcional)</label><input id="obs-concluir" placeholder="Registrada no histórico"></div>' +
      '<button class="btn verde" data-acao="concluir"' + (w.pendencias.length ? ' disabled title="Resolva as pendências acima"' : '') + '>' + ic('check', 16) + 'Concluir etapa</button></div>' +
      (w.destinosDevolucao.length ? '<details class="devolver"><summary>Devolver para uma etapa anterior</summary><div class="linha" style="align-items:flex-end">' +
        '<div><label>Devolver para</label><select id="dev-destino">' + w.destinosDevolucao.map(function (d) {
          return '<option value="' + esc(d.codigo) + '">' + esc(d.nome) + '</option>';
        }).join('') + '</select></div><div><label>Motivo <span class="obrig">*</span></label><input id="dev-motivo"></div>' +
        '<div style="flex:0 0 auto"><button class="btn perigo" data-acao="devolver">' + ic('voltar', 16) + 'Devolver</button></div></div></details>' : '') + '</div>';
  }
  $('#area-trabalho').innerHTML = cab + pend + blocos + rodape;
}

// ---------- blocos da área de trabalho
/** Sugestão de preenchimento (cfg_Campos.valorPadrao) com botão "Usar". */
function sugestaoHtml(c, ed) {
  var s = S.tar && S.tar.sugestoes && S.tar.sugestoes[c.chave];
  if (!s || !ed) return '';
  var atual = S.tar.valores[c.chave];
  if (atual !== undefined && String(atual) === String(s.valor)) return '';
  var exibir = c.tipo === 'moeda' ? brl(s.valor) : String(s.valor);
  if (exibir.length > 220) exibir = exibir.slice(0, 220) + '…';
  return '<div class="sugestao">' + ic('lampada', 14) + ' <b>Sugestão</b> <span class="ajuda">(' + esc(s.origem) + ')</span>: ' + esc(exibir) +
    ' <button class="btn sec peq" data-acao="usarSugestao" data-campo="' + esc(c.chave) + '">Usar</button></div>';
}

function permiteNsa(c) { return c.tipo === 'secaoLei' && /(^|[,;\s])NSA($|[,;\s])/i.test(c.opcoes || ''); }

/** Seção de documento (ex.: inciso do ETP): recolhível, com "Não se aplica" quando permitido. */
function secaoHtml(c, w, ed) {
  var v = w.valores[c.chave] || '';
  var nsa = permiteNsa(c) && w.valores[c.chave + '_nsa'] === 'true';
  var ok = String(v).trim() !== '';
  var ico = ok ? (nsa ? '<span class="ajuda">—</span>' : '<span style="color:var(--verde)">' + ic('check', 16) + '</span>') : '<span class="ponto"></span>';
  var dis = ed ? '' : ' disabled';
  return '<details class="secao' + (ok ? ' ok' : '') + '"' + (ok ? '' : ' open') + ' data-secao="' + esc(c.chave) + '">' +
    '<summary><span class="ico">' + ico + '</span><span>' + esc(c.rotulo) + (permiteNsa(c) ? '' : ' <span class="obrig">*</span>') + '</span>' +
    (nsa ? ' <span class="tag RASCUNHO">Não se aplica</span>' : '') + '</summary><div class="secao-corpo">' +
    (c.ajuda ? '<div class="ajuda">' + esc(c.ajuda) + '</div>' : '') +
    (permiteNsa(c) ? '<label class="check" style="font-weight:normal"><input type="checkbox" name="' + esc(c.chave) + '_nsa" data-change="nsa"' +
      (nsa ? ' checked' : '') + dis + '> Não se aplica <span class="ajuda">(art. 18, §2º — justifique abaixo)</span></label>' : '') +
    '<textarea class="grande" name="' + esc(c.chave) + '" placeholder="' + (nsa ? 'Justificativa do “Não se aplica”' : 'Texto da seção') + '"' + dis + '>' +
    esc(v) + '</textarea>' + sugestaoHtml(c, ed) + '</div></details>';
}

function campoHtml(c, valor, ed) {
  if (c.tipo === 'secaoLei') return secaoHtml(c, S.tar, ed);
  var dis = ed ? '' : ' disabled';
  var v = valor === undefined || valor === null ? '' : valor;
  var rot = '<label>' + esc(c.rotulo) + (c.obrigatorio ? ' <span class="obrig">*</span>' : '') + '</label>';
  var inp;
  switch (c.tipo) {
    case 'textoLongo': inp = '<textarea name="' + esc(c.chave) + '"' + dis + '>' + esc(v) + '</textarea>'; break;
    case 'inteiro': inp = '<input type="number" step="1" min="0" inputmode="numeric" data-inteiro="1" name="' + esc(c.chave) + '" value="' + esc(v) + '"' + dis + '>'; break;
    case 'numero': case 'moeda': inp = '<input type="number" step="' + (c.tipo === 'moeda' ? '0.01' : 'any') + '" name="' + esc(c.chave) + '" value="' + esc(v) + '"' + dis + '>'; break;
    case 'data': inp = '<input type="date" name="' + esc(c.chave) + '" value="' + esc(v) + '"' + dis + '>'; break;
    case 'email': inp = '<input type="email" name="' + esc(c.chave) + '" value="' + esc(v) + '"' + dis + '>'; break;
    case 'simNao': c = Object.assign({}, c, { opcoes: 'SIM;NAO' }); // segue para seleção
    case 'selecao':
      inp = '<select name="' + esc(c.chave) + '"' + dis + '><option value="">— selecione —</option>' +
        String(c.opcoes || '').split(';').filter(String).map(function (o) {
          o = o.trim();
          return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(o === 'NAO' ? 'NÃO' : o) + '</option>';
        }).join('') + '</select>';
      break;
    default: inp = '<input name="' + esc(c.chave) + '" value="' + esc(v) + '"' + dis + '>';
  }
  return '<div>' + rot + inp + (c.ajuda ? '<div class="ajuda">' + esc(c.ajuda) + '</div>' : '') + sugestaoHtml(c, ed) + '</div>';
}

/** Renderiza os campos; consecutivos com o mesmo "linha" (cfg_Campos) ficam lado a lado. */
function camposEmLinhas(campos, w, ed) {
  var html = '';
  for (var i = 0; i < campos.length; i++) {
    var c = campos[i];
    var grupo = [c];
    while (c.linha && c.tipo !== 'secaoLei' && campos[i + 1] && campos[i + 1].linha === c.linha) grupo.push(campos[++i]);
    var partes = grupo.map(function (x) { return campoHtml(x, w.valores[x.chave], ed); }).join('');
    html += grupo.length > 1 ? '<div class="linha">' + partes + '</div>' : partes;
  }
  return html;
}

function bFormulario(w, ed) {
  if (!w.campos.length) return '';
  var secoes = w.campos.filter(function (c) { return c.tipo === 'secaoLei'; });
  var feitas = secoes.filter(function (c) { return String(w.valores[c.chave] || '').trim() !== ''; }).length;
  var progresso = secoes.length ? '<span class="progresso"><span style="width:' + Math.round(100 * feitas / secoes.length) + '%"></span></span>' +
    '<span class="ajuda">' + feitas + ' de ' + secoes.length + ' seções preenchidas</span>' : '';
  return '<div class="bloco" id="bloco-form">' + cabBloco('editar', 'Dados da etapa', '<span class="acoes">' + progresso +
    (secoes.length ? '<button class="btn sec peq" data-acao="expandirSecoes">Expandir/recolher</button>' : '') + '</span>') +
    camposEmLinhas(w.campos, w, ed) +
    (ed ? '<div class="acoes barra-salvar"><button class="btn" data-acao="salvarCampos" data-raiz="#bloco-form">' + ic('check', 15) + 'Salvar dados</button>' +
      '<span class="ajuda">Salve com frequência — os textos ficam guardados como rascunho até a conclusão da etapa.</span></div>' : '') + '</div>';
}

function bDecisao(w, ed) {
  if (!w.decisao) return '';
  var v = w.valores[w.decisao.variavel] || '';
  return '<div class="bloco" id="bloco-decisao">' + cabBloco('decisao', 'Decisão') + '<p>' + esc(w.etapa.descricao || w.etapa.nome) + '</p>' +
    w.decisao.opcoes.map(function (o) {
      return '<label class="check" style="font-weight:normal"><input type="radio" name="' + esc(w.decisao.variavel) + '" value="' + esc(o) + '"' +
        (o === v ? ' checked' : '') + (ed ? '' : ' disabled') + '> ' + esc(o === 'NAO' ? 'NÃO' : o) + '</label>';
    }).join('') +
    (ed ? '<div class="acoes" style="margin-top:8px"><button class="btn" data-acao="salvarCampos" data-raiz="#bloco-decisao">Registrar decisão</button></div>' : '') + '</div>';
}

function bChecklist(w, ed) {
  if (!w.checklist.length) return '';
  return '<div class="bloco" id="bloco-check">' + cabBloco('tarefas', 'Checklist') + w.checklist.map(function (i) {
    return '<label class="check" style="font-weight:normal"><input type="checkbox" data-acao="checklist" data-item="' + esc(i.id) + '"' +
      (i.marcado ? ' checked' : '') + (ed ? '' : ' disabled') + '> ' + esc(i.descricao) + (i.obrigatorio ? ' <span class="obrig">*</span>' : '') + '</label>';
  }).join('') + '</div>';
}

function exigeAssinatura(tipo) { return ((S.ctx.assinaturasPorTipo || {})[tipo] || []).length > 0; }

/** Ações do documento conforme status e exigência de assinatura no SUITE. */
function acoesDoc(d, ed) {
  if (!ed) return '';
  var b = function (acao, rotulo, extra, cls) {
    return '<button class="btn ' + (cls || 'sec') + ' peq" data-acao="' + acao + '" data-doc="' + esc(d.id) + '"' + (extra || '') + '>' + rotulo + '</button> ';
  };
  if (exigeAssinatura(d.tipoCodigo) && d.origem === 'GERADO') {
    if (d.status === 'RASCUNHO') return b('enviarAssinatura', ic('assinar', 14) + 'Enviar para assinatura (SUITE)', '', '');
    if (d.status === 'EM_ASSINATURA') return b('statusDoc', 'Cancelar assinatura', ' data-status="RASCUNHO"');
    return b('statusDoc', 'Voltar a rascunho', ' data-status="RASCUNHO"');
  }
  return b('statusDoc', d.status === 'FINAL' ? 'Voltar a rascunho' : 'Marcar como final', ' data-status="' + (d.status === 'FINAL' ? 'RASCUNHO' : 'FINAL') + '"');
}

/** Linha de assinaturas do documento (quem já assinou no SUITE). */
function linhaAssinaturas(d, assinaturas, ed) {
  var l = (assinaturas || []).filter(function (a) { return a.documentoId === d.id; });
  if (!l.length || d.status === 'RASCUNHO') return '';
  return '<tr class="sub"><td colspan="6"><div class="assinaturas">' +
    (d.pdfUrl ? '<a class="btn sec peq" href="' + esc(d.pdfUrl) + '" target="_blank">' + ic('doc', 14) + 'PDF para o SUITE</a> ' : '') +
    l.map(function (a) {
      var assinado = a.status === 'ASSINADO';
      return '<span class="assinante ' + (assinado ? 'ok' : '') + '">' + (assinado ? ic('check', 13) : ic('relogio', 13)) + ' <b>' + esc(a.signatario) + '</b>' +
        (a.cargo ? ' <span class="ajuda">' + esc(a.cargo) + '</span>' : '') +
        (assinado ? ' <span class="ajuda">em ' + dataBR(a.assinadoEm) + '</span>' :
          (ed && d.status === 'EM_ASSINATURA' ? ' <button class="btn peq" data-acao="registrarAssinatura" data-id="' + esc(a.id) + '">Assinou</button>' : '')) +
        '</span>';
    }).join('') + '</div></td></tr>';
}

function tabelaDocs(docs, ed, assinaturas) {
  if (!docs.length) return '<div class="vazio">Nenhum documento.</div>';
  return '<table><tr><th>Documento</th><th>Tipo</th><th>Versão</th><th>Status</th><th>Criado</th><th></th></tr>' + docs.map(function (d) {
    var assina = exigeAssinatura(d.tipoCodigo);
    return '<tr><td><a href="' + esc(d.url) + '" target="_blank">' + esc(d.nome) + '</a>' +
      (assina ? '<br><span class="ajuda">' + ic('assinar', 12) + ' Assinam: ' + esc(S.ctx.assinaturasPorTipo[d.tipoCodigo].map(function (a) { return a.signatario === '{{responsavelTecnico}}' ? 'Resp. técnico' : a.signatario; }).join(', ')) + '</span>' : '') +
      '</td><td>' + esc(nomeTipoDoc(d.tipoCodigo)) + '</td>' +
      '<td>v' + esc(d.versao) + '</td><td>' + tag(d.status) + '</td><td>' + dataBR(d.criadoEm) + '<br><span class="ajuda">' + esc(nomeUsuario(d.criadoPor)) + '</span></td>' +
      '<td>' + acoesDoc(d, ed) + '</td></tr>' + linhaAssinaturas(d, assinaturas, ed);
  }).join('') + '</table>';
}

function formAnexo(prefixo, tipoPadrao) {
  return '<div class="linha" style="margin-top:10px"><div><label>Tipo</label><select id="' + prefixo + '-tipo">' + opcoesTiposDoc(tipoPadrao || 'OUTRO') + '</select></div>' +
    '<div><label>Arquivo</label><input type="file" id="' + prefixo + '-arq"></div>' +
    '<div style="flex:0 0 auto;align-self:end"><button class="btn sec" data-acao="anexar" data-prefixo="' + prefixo + '">' + ic('anexo', 15) + 'Anexar</button></div></div>' +
    '<div class="linha"><div><label>…ou vincular arquivo já existente no Drive (link)</label><input id="' + prefixo + '-link" placeholder="https://drive.google.com/..."></div>' +
    '<div style="flex:0 0 auto;align-self:end"><button class="btn sec" data-acao="vincular" data-prefixo="' + prefixo + '">' + ic('link', 15) + 'Vincular</button></div></div>';
}

function bDocumentos(w, ed) {
  var tipo = w.etapa.documentoTipo;
  return '<div class="bloco" id="bloco-docs">' + cabBloco('doc', 'Documentos' + (tipo ? ' — ' + esc(nomeTipoDoc(tipo)) : ''),
    ed && tipo && tipo !== 'MAPA_PRECOS' ? '<button class="btn peq" data-acao="gerarDoc" data-tipo="' + esc(tipo) + '">' + ic('editar', 14) + 'Gerar a partir do modelo</button>' : '') +
    tabelaDocs(w.documentos, ed, w.assinaturas) + (ed ? formAnexo('wt', tipo) : '') + '</div>';
}

function bSolicitacao(w, ed) {
  var t = w.tarefa;
  var h = '<div class="bloco" id="bloco-solic">' + cabBloco('enviar', 'Solicitação a outro setor');
  if (t.enviadoEm) h += '<div class="info-linha">' + ic('enviar', 15) + 'Enviado em <b>' + dataBR(t.enviadoEm) + '</b>' + (t.referenciaEnvio ? ' — ' + esc(t.referenciaEnvio) : '') + '</div>';
  if (t.retornoEm) h += '<div class="info-linha">' + ic('receber', 15) + 'Retorno em <b>' + dataBR(t.retornoEm) + '</b>' + (t.referenciaRetorno ? ' — ' + esc(t.referenciaRetorno) : '') + '</div>';
  if (ed && t.status === 'ABERTA') {
    h += '<div class="linha"><div><label>' + (t.retornoEm ? 'Novo envio — ' : '') + 'Referência do envio (ofício, despacho, e-mail)</label><input id="env-ref"></div>' +
      '<div style="flex:0 0 160px"><label>Data</label><input type="date" id="env-data" value="' + hojeISO() + '"></div>' +
      '<div style="flex:0 0 auto;align-self:end"><button class="btn" data-acao="registrarEnvio">' + ic('enviar', 15) + 'Registrar envio</button></div></div>';
  }
  if (ed && t.status === 'AGUARDANDO_RETORNO') {
    h += '<div class="info-linha aguardando">' + ic('relogio', 15) + '<b>Aguardando retorno</b>' + (t.enviadoEm ? ' há ' + diasEntre(t.enviadoEm, hojeISO()) + ' dia(s)' : '') + '</div><div class="linha"><div><label>Referência do retorno</label><input id="ret-ref"></div>' +
      '<div style="flex:0 0 160px"><label>Data</label><input type="date" id="ret-data" value="' + hojeISO() + '"></div>' +
      '<div style="flex:0 0 auto;align-self:end"><button class="btn" data-acao="registrarRetorno">' + ic('receber', 15) + 'Registrar retorno</button></div></div>';
  }
  return h + '</div>';
}

function bCotacoes(w, ed) {
  var cot = w.cotacoes || [];
  var h = '<div class="bloco" id="bloco-cot">' + cabBloco('dinheiro', 'Cotações');
  h += cot.length ? '<table><tr><th>Item</th><th>Fornecedor</th><th>Fonte</th><th>Data</th><th class="num">Qtd</th><th class="num">Valor unit.</th><th>Considerada</th><th></th></tr>' +
    cot.map(function (c) {
      return '<tr><td>' + esc(c.item) + (c.descricao ? '<br><span class="ajuda">' + esc(c.descricao) + '</span>' : '') + '</td><td>' + esc(c.fornecedor) +
        (c.cnpj ? '<br><span class="ajuda">' + esc(c.cnpj) + '</span>' : '') + '</td><td>' + esc(c.fonte) + '</td><td>' + dataBR(c.dataCotacao) + '</td>' +
        '<td class="num">' + esc(c.quantidade) + ' ' + esc(c.unidade) + '</td><td class="num">' + brl(c.valorUnitario) + '</td>' +
        '<td>' + (ed ? '<input type="checkbox" data-acao="toggleCotacao" data-id="' + esc(c.id) + '"' + (c.considerado ? ' checked' : '') + '>' : (c.considerado ? 'Sim' : 'Não')) + '</td>' +
        '<td>' + (ed ? '<button class="btn sec peq" data-acao="removerCotacao" data-id="' + esc(c.id) + '">Excluir</button>' : '') + '</td></tr>';
    }).join('') + '</table>' : '<div class="vazio">Nenhuma cotação registrada.</div>';
  if (ed) {
    h += '<details style="margin-top:10px"' + (cot.length ? '' : ' open') + '><summary><b>+ Registrar cotação</b></summary><div id="form-cot">' +
      '<div class="linha"><div><label>Item <span class="obrig">*</span></label><input name="item" list="lista-itens" placeholder="Mesmo nome agrupa as cotações"></div>' +
      '<div><label>Descrição</label><input name="descricao"></div></div>' +
      '<datalist id="lista-itens">' + Array.from(new Set(cot.map(function (c) { return c.item; }))).map(function (i) { return '<option value="' + esc(i) + '">'; }).join('') + '</datalist>' +
      '<div class="linha"><div><label>Unidade</label><input name="unidade" placeholder="UST, mês, un"></div><div><label>Quantidade</label><input type="number" name="quantidade" value="1"></div>' +
      '<div><label>Valor unitário (R$) <span class="obrig">*</span></label><input type="number" step="0.01" name="valorUnitario"></div></div>' +
      '<div class="linha"><div><label>Fonte</label><select name="fonte">' + (w.fontes || []).map(function (f) { return '<option>' + esc(f) + '</option>'; }).join('') + '</select></div>' +
      '<div><label>Fornecedor / órgão</label><input name="fornecedor"></div><div><label>CNPJ</label><input name="cnpj"></div></div>' +
      '<div class="linha"><div><label>Data da cotação</label><input type="date" name="dataCotacao"></div><div><label>Referência (link, nº contrato, ata)</label><input name="referencia"></div></div>' +
      '<div class="acoes" style="margin-top:10px"><button class="btn" data-acao="salvarCotacao">Adicionar cotação</button></div></div></details>';
  }
  return h + '</div>';
}

function bMapa(w, ed) {
  var m = w.mapa;
  var h = '<div class="bloco" id="bloco-mapa"><h3><span><span class="ib">' + ic('grafico', 16) + '</span>Mapa comparativo</span><span class="acoes">' +
    '<select id="mapa-metodo" data-change="metodoMapa" style="width:auto">' + Object.keys(S.ctx.metodosMapa).map(function (k) {
      return '<option value="' + k + '"' + (k === m.metodo ? ' selected' : '') + '>' + esc(S.ctx.metodosMapa[k]) + '</option>';
    }).join('') + '</select>' +
    (ed ? '<button class="btn peq" data-acao="gerarMapa">' + ic('doc', 14) + 'Gerar documento do mapa</button>' : '') + '</span></h3>';
  if (!m.itens.length) return h + '<div class="vazio">Nenhuma cotação registrada na etapa de pesquisa de preços.</div></div>';
  h += '<p class="ajuda">Valores com variação maior que ' + Math.round(m.limiteDesvio * 100) + '% em relação à mediana aparecem em vermelho. Desmarque-os na pesquisa de preços se forem descartados.</p>';
  m.itens.forEach(function (i) {
    h += '<h3 style="margin-top:12px">' + esc(i.item) + (i.descricao ? ' — <span class="ajuda">' + esc(i.descricao) + '</span>' : '') + '</h3>' +
      '<table><tr><th>Fornecedor</th><th>Fonte</th><th class="num">Valor unitário</th><th>Considerada</th></tr>' + i.cotacoes.map(function (c) {

  return vProcesso().then(function () {
    Rotas.atualizar(true);
    if (msg) toast(msg);
  });
}

var ACOES = {

  selTarefa: function (d) { carregarTarefa(d.tarefa).then(function () { Rotas.atualizar(); }); },

  statusProcesso: function (d) {

      .then(function (motivo) { if (motivo) acaoTela('alterarStatusProcesso', [S.procId, d.status, motivo], 'Status do processo alterado.'); });
  },
  salvarProcesso: function () {
    acaoTela('atualizarProcesso', [S.procId, valoresForm($('#form-dados'))], 'Dados salvos.');
  },

  salvarCampos: function (d) {

  },
  checklist: function (d, el) {

    var auto = (S.tar.proximas || []).filter(function (x) { return x.automatica; });
    var detalhe = prox.length
      ? ic('seta', 16) + '<span>' + (prox.length > 1 ? 'Próximas etapas (em paralelo):' : 'Próxima etapa:') + ' <b>' + prox.map(function (x) { return esc(x.nome); }).join(', ') + '</b></span>'
      : auto.length ? ic('seta', 16) + '<span>' + esc(auto[0].nome) + '</span>' : '';
    Dialogo.abrir({ tipo: 'sucesso', icone: 'check', titulo: 'Concluir “' + nome + '”?',
      texto: 'Os dados e documentos desta etapa ficarão registrados no histórico e o processo avançará no fluxo.',

      .then(function (ok) {

  salvarUsuario: function () {
    ocupado(api('salvarUsuario', valoresForm($('#form-usu'))), 'Usuário salvo.').then(function () {
      return api('contexto').then(function (c) { S.ctx = c; ir('admin'); });
    });
  },
  atualizarConfiguracao: function () {
    Dialogo.abrir({ icone: 'atualizar', titulo: 'Aplicar atualizações da configuração?', texto: 'Nenhum processo ou dado é apagado.', ok: 'Aplicar' })
      .then(function (ok) { if (ok) ACOES.aplicarAtualizacoes(); });
  },
  irPendencia: function (d) {
    var alvo = alvoPendencia(S.tar.pendencias[Number(d.i)]);
    var bloco = alvo && $('#' + alvo.bloco);
    if (!bloco) return;
    bloco.scrollIntoView({ behavior: 'smooth', block: 'start' });
    bloco.classList.add('destacado');
    setTimeout(function () { bloco.classList.remove('destacado'); }, 1800);
    if (alvo.rotulo) {
      var rot = $$('label, summary', bloco).filter(function (l) { return l.textContent.indexOf(alvo.rotulo) >= 0; })[0];
      if (!rot) return;
      var sec = rot.closest('details');
      if (sec) sec.open = true;
      var entrada = (sec || rot.parentNode).querySelector('textarea, input:not([type=checkbox]), select');
      if (entrada) {
        setTimeout(function () { entrada.focus({ preventScroll: true }); }, 350);
        entrada.classList.add('campo-destacado');
        setTimeout(function () { entrada.classList.remove('campo-destacado'); }, 2200);
      }
    }
  },
  filtroStatus: function (d) {
    S.filtro = { texto: ($('#f-texto') || {}).value || '', status: d.status };
    ir('processos');
  },
  aplicarAtualizacoes: function () {
    ocupado(api('atualizarConfiguracao'), 'Configuração atualizada.').then(function (log) {
      return api('contexto').then(function (c) {
        S.ctx = c;
        avisoConfiguracao();
        return ir(S.view === 'admin' ? 'admin' : S.view).then(function () {
          var el = $('#log-config');
          if (el) { el.textContent = log.join('\n'); el.classList.remove('oculto'); }
        });
      });
    });
  },
  recarregarConfig: function () {
    ocupado(api('recarregarConfig'), 'Configuração recarregada.').then(function () {
      return api('contexto').then(function (c) { S.ctx = c; });
    });
  }
};

var MUDANCAS = {
  nsa: function (el) {
    var area = el.closest('.secao-corpo').querySelector('textarea');
    area.placeholder = el.checked ? 'Justificativa do “Não se aplica”' : 'Texto da seção';
    if (el.checked) area.focus();
  },
  atribuir: function (el) {
    ocupado(api('atribuirTarefa', S.tarefaId, el.value), 'Analista responsável alterado.');
  },
  metodoMapa: function (el) {
    api('calcularMapa', S.procId, el.value).then(function (m) { S.tar.mapa = m; renderTrabalho(); });
  }
};

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-acao]');
  if (!el) return;
  if (el.type !== 'checkbox' && el.type !== 'radio') ev.preventDefault();
  var fn = ACOES[el.dataset.acao];
  if (fn) fn(el.dataset, el);
});
document.addEventListener('keydown', function (ev) {
  if (ev.target.dataset && ev.target.dataset.inteiro && /^[.,eE+\-]$/.test(ev.key)) ev.preventDefault();
});
document.addEventListener('change', function (ev) {
  var el = ev.target.closest('[data-change]');
  if (el && MUDANCAS[el.dataset.change]) MUDANCAS[el.dataset.change](el);
});

// ------------------------------------------------------------------ busca global (Ctrl+K)
document.addEventListener('keydown', function (ev) {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); $('#busca-global').focus(); $('#busca-global').select(); }
});
$('#busca-global').addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter') return;
  S.filtro = { texto: ev.target.value.trim(), status: '' };
  ir('processos');
});
aplicarIcones(document);

// ------------------------------------------------------------------ início
api('contexto').then(function (ctx) {
  S.ctx = ctx;
  var PAPEL = { ADMIN: 'Administrador', GESTOR: 'Gestor', ANALISTA: 'Analista', CONSULTA: 'Consulta' };
  $('#usuario').textContent = ctx.usuario.nome;
  $('#usuario-papel').textContent = PAPEL[ctx.usuario.papel] || ctx.usuario.papel;
  $('#avatar').textContent = iniciais(ctx.usuario.nome);
  if (ctx.usuario.papel === 'ADMIN') { $('#menu-admin').classList.remove('oculto'); $('#rotulo-gestao').classList.remove('oculto'); }
  if (!podeEditar()) $('#menu a[data-view=novo]').classList.add('oculto');
  var suite = (ctx.sistemasExternos || []).filter(function (x) { return x.nome === 'SUITE'; })[0];
  if (suite) { $('#botao-suite').href = suite.url; $('#botao-suite').classList.remove('oculto'); }
  avisoConfiguracao();
  Rotas.iniciar();
}).catch(function (e) {
  app('<div class="card"><h2>Não foi possível entrar</h2><p>' + esc(e.message) + '</p></div>');
});
</script>
