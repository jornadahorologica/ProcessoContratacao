<style>
  :root {
    --azul: #1f4e79; --azul-claro: #e8f0fa; --cinza: #6b7280; --borda: #d9dee7; --fundo: #f5f7fb;
    --verde: #1e7b4f; --verde-claro: #e3f4ea; --amarelo: #a86b00; --amarelo-claro: #fff4d6;
    --vermelho: #b42318; --vermelho-claro: #fde8e7; --roxo: #6941c6; --roxo-claro: #f0ebff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; color: #1f2937; background: var(--fundo); }
  a { color: var(--azul); }
  .oculto { display: none !important; }
  .topo { display: flex; align-items: center; gap: 24px; background: var(--azul); color: #fff; padding: 0 20px; height: 52px; position: sticky; top: 0; z-index: 10; }
  .topo .marca { font-weight: 600; font-size: 16px; }
  .topo nav a { color: #dbe7f5; text-decoration: none; margin-right: 18px; }
  .topo nav a:hover, .topo nav a.ativo { color: #fff; text-decoration: underline; }
  .topo .usuario { margin-left: auto; font-size: 12px; opacity: .9; }
  main { padding: 20px; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; } h2 { font-size: 16px; margin: 0 0 10px; } h3 { font-size: 14px; margin: 0 0 8px; }
  .carregando { color: var(--cinza); padding: 40px; text-align: center; }
  .card { background: #fff; border: 1px solid var(--borda); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); }
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi { background: #fff; border: 1px solid var(--borda); border-radius: 8px; padding: 12px 16px; }
  .kpi .v { font-size: 26px; font-weight: 600; } .kpi .r { color: var(--cinza); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  th { font-size: 12px; color: var(--cinza); font-weight: 600; background: #fafbfd; }
  tr.clicavel:hover { background: var(--azul-claro); cursor: pointer; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: #eef0f4; color: #374151; white-space: nowrap; }
  .tag.ABERTA, .tag.EM_ANDAMENTO { background: var(--azul-claro); color: var(--azul); }
  .tag.AGUARDANDO_RETORNO, .tag.SUSPENSO, .tag.RASCUNHO { background: var(--amarelo-claro); color: var(--amarelo); }
  .tag.CONCLUIDA, .tag.CONCLUIDO, .tag.FINAL, .tag.RESPONDIDA { background: var(--verde-claro); color: var(--verde); }
  .tag.DEVOLVIDA, .tag.CANCELADA, .tag.CANCELADO, .tag.atraso { background: var(--vermelho-claro); color: var(--vermelho); }
  .tag.NAO_INICIADA { background: #f3f4f6; color: #9ca3af; }
  .btn { border: 1px solid var(--azul); background: var(--azul); color: #fff; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  .btn:hover { filter: brightness(1.1); } .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.sec { background: #fff; color: var(--azul); } .btn.perigo { background: var(--vermelho); border-color: var(--vermelho); }
  .btn.verde { background: var(--verde); border-color: var(--verde); } .btn.peq { padding: 3px 8px; font-size: 12px; }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin: 10px 0 4px; }
  label .obrig { color: var(--vermelho); }
  .ajuda { font-size: 11px; color: var(--cinza); margin-top: 2px; }
  input, select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--borda); border-radius: 6px; font: inherit; background: #fff; }
  textarea { min-height: 72px; resize: vertical; }
  input[type=checkbox], input[type=radio] { width: auto; }
  .linha { display: flex; gap: 10px; } .linha > * { flex: 1; }
  .kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .coluna { background: #eef1f6; border-radius: 8px; padding: 10px; min-height: 120px; }
  .coluna h3 { font-size: 12px; text-transform: uppercase; color: var(--cinza); display: flex; justify-content: space-between; }
  .cartao { background: #fff; border: 1px solid var(--borda); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
  .cartao:hover { border-color: var(--azul); }
  .cartao .n { font-size: 11px; color: var(--cinza); } .cartao .t { font-weight: 600; margin: 2px 0 4px; }
  .cartao .e { font-size: 12px; }
  .cab-proc { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .logos-externos { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
  .logo-externo { display: inline-flex; align-items: center; padding: 6px 10px; border: 1px solid var(--borda); border-radius: 8px; background: #fff; text-decoration: none; font-weight: 600; transition: box-shadow .15s, border-color .15s; }
  .logo-externo:hover { border-color: var(--azul); box-shadow: 0 2px 8px rgba(31,78,121,.18); }
  .logo-externo img { max-height: 40px; max-width: 160px; display: block; }
  .cab-proc .meta { color: var(--cinza); font-size: 12px; margin-top: 4px; }
  .abas { display: flex; gap: 4px; border-bottom: 1px solid var(--borda); margin-bottom: 16px; }
  .abas a { padding: 8px 14px; text-decoration: none; color: var(--cinza); border-bottom: 2px solid transparent; }
  .abas a.ativo { color: var(--azul); border-bottom-color: var(--azul); font-weight: 600; }
  .fluxo { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }

  .timeline .item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .timeline .item:hover { background: var(--azul-claro); } .timeline .item.sel { background: var(--azul-claro); outline: 1px solid var(--azul); }
  .timeline .item.inativo { cursor: default; opacity: .6; } .timeline .item.inativo:hover { background: none; }
  .timeline .ico { width: 20px; text-align: center; }
  .bloco { border: 1px solid var(--borda); border-radius: 8px; padding: 14px; margin-bottom: 14px; background: #fff; }
  .bloco > h3 { display: flex; justify-content: space-between; align-items: center; }
  .pend { background: var(--amarelo-claro); border: 1px solid #f3d38b; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
  .pend ul { margin: 6px 0 0; padding-left: 18px; }
  .ok-box { background: var(--verde-claro); border: 1px solid #a6dcbc; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
  .check { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
  .num { text-align: right; white-space: nowrap; }
  .destoante { color: var(--vermelho); font-weight: 600; }
  .vazio { color: var(--cinza); font-style: italic; padding: 8px 0; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 50; max-width: 80%; white-space: pre-line; }
  .toast.erro { background: var(--vermelho); }
  .ocupado { position: fixed; inset: 0; background: rgba(255,255,255,.5); z-index: 40; display: flex; align-items: center; justify-content: center; }
  .spinner { width: 36px; height: 36px; border: 4px solid var(--azul-claro); border-top-color: var(--azul); border-radius: 50%; animation: gira 0.8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  @media (max-width: 900px) { .fluxo, .g2, .g3 { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, 1fr); } }
</style>
