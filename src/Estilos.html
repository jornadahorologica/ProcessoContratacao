<style>
  /* =====================================================================
   * Identidade visual — "Institucional moderno"
   * Azul-marinho (menu) · verde (ações de avanço/sucesso) · azul (ações e etapa atual)
   * ===================================================================== */
  /* ------------------------------------------------------------ Tema CLARO (padrão) */
  :root {
    --navy: #0b2540; --navy-2: #0a1f36; --navy-txt: #cbd5e1;
    --lateral-1: #0b2540; --lateral-2: #0a1f36; --menu-ativo: #0b2540;
    --verde: #0e9f6e; --verde-esc: #0b8a5f; --verde-c: #e7f7f0;
    --azul: #2563eb; --azul-esc: #1d4ed8; --azul-c: #eaf1ff;
    --ambar: var(--ambar); --ambar-c: #fff7e6; --ambar-borda: #fde7c2; --ambar-forte: #f59e0b;
    --vermelho: #b91c1c; --vermelho-c: #fdecec;
    --roxo: #6d28d9; --roxo-c: #f1ebff;
    --acao: #2563eb; --acao-verde: #0e9f6e; --acao-perigo: #b91c1c;
    --texto: #0f172a; --texto-2: #334155; --texto-3: #475569; --suave: #64748b;
    --borda: #e5e9f0; --borda-forte: #d6dde8; --borda-foco: #c9d6ea; --neutro-borda: #cbd5e1; --linha: #e2e8f0;
    --fundo: #f3f6fa; --sup: #fff; --sup-2: #f8fafc; --sup-3: #f1f5f9; --hover: #f6f9ff; --pilula: #eef2f7; --kanban: #f6f8fb;
    --pend-bg: #fffaf0; --pend-txt: #92400e; --pend-borda-2: #fdecc8; --ok-borda: #a6dcbc; --perigo-borda: #f3c7c7;
    --topo-bg: rgba(243, 246, 250, .85); --ocupado-bg: rgba(243, 246, 250, .45);
    --branco: #fff;
    --raio: 16px; --raio-p: 10px;
    --sombra: 0 1px 2px rgba(15, 23, 42, .04), 0 1px 3px rgba(15, 23, 42, .04);
    --sombra-alta: 0 30px 60px rgba(15, 23, 42, .25);
    --lateral: 252px;
    color-scheme: light;
  }
  /* ------------------------------------------------------------ Tema ESCURO */
  :root[data-tema="escuro"] {
    --lateral-1: #13284a; --lateral-2: #0f2140; --menu-ativo: #f1f5f9;
    --verde: #34d399; --verde-esc: #34d399; --verde-c: rgba(52, 211, 153, .13);
    --azul: #60a5fa; --azul-esc: #93c5fd; --azul-c: rgba(96, 165, 250, .14);
    --ambar: #fbbf24; --ambar-c: rgba(251, 191, 36, .12); --ambar-borda: rgba(251, 191, 36, .3); --ambar-forte: #f59e0b;
    --vermelho: #f87171; --vermelho-c: rgba(248, 113, 113, .13);
    --roxo: #c4b5fd; --roxo-c: rgba(167, 139, 250, .15);
    --acao: #2563eb; --acao-verde: #059669; --acao-perigo: #dc2626;
    --texto: #e5e7eb; --texto-2: #cbd5e1; --texto-3: #a3b1c6; --suave: #8b9ab0;
    --borda: #223049; --borda-forte: #2d3d5a; --borda-foco: #3b5b8f; --neutro-borda: #3b4a66; --linha: #2a3852;
    --fundo: #0b1220; --sup: #121b2d; --sup-2: #0f1727; --sup-3: #1b2639; --hover: #17233a; --pilula: #1b2639; --kanban: #0f1727;
    --pend-bg: rgba(251, 191, 36, .06); --pend-txt: #fbbf24; --pend-borda-2: rgba(251, 191, 36, .22); --ok-borda: rgba(52, 211, 153, .35);
    --perigo-borda: rgba(248, 113, 113, .4);
    --topo-bg: rgba(11, 18, 32, .85); --ocupado-bg: rgba(11, 18, 32, .5);
    --sombra: 0 1px 2px rgba(0, 0, 0, .35);
    --sombra-alta: 0 30px 60px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
  :root[data-tema="escuro"] .kpi.destaque { background: linear-gradient(135deg, #1e3a8a, #0f2a5c); }
  :root[data-tema="escuro"] .veu { background: rgba(2, 6, 23, .65); }
  :root[data-tema="escuro"] .logo-externo { border-color: #3a3426; }
  body, .card, .bloco, .topo, .kpi, .cartao, input, select, textarea { transition: background-color .2s, border-color .2s, color .2s; }

  /* Seletor de tema (barra superior) */
  .tema { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--pilula); border: 1px solid var(--borda); }
  .tema button { display: inline-flex; align-items: center; gap: 6px; border: none; background: transparent; color: var(--suave); padding: 7px 11px;
    border-radius: 9px; font: 600 12.5px Inter, "Segoe UI", sans-serif; cursor: pointer; }
  .tema button:hover { color: var(--texto); }
  .tema button.on { background: var(--sup); color: var(--texto); box-shadow: var(--sombra); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 14px; color: var(--texto); background: var(--fundo); -webkit-font-smoothing: antialiased; }
  a { color: var(--azul); }
  .oculto { display: none !important; }
  .ic { flex: none; vertical-align: middle; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.01em; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  h3 { font-size: 14px; margin: 0 0 12px; }
  .ajuda { font-size: 12px; color: var(--suave); }
  .vazio { color: var(--suave); padding: 14px 0; display: flex; align-items: center; gap: 8px; }
  .carregando { color: var(--suave); padding: 48px; text-align: center; }

  /* ---------------------------------------------------------------- Menu lateral */
  .lateral { position: fixed; inset: 0 auto 0 0; width: var(--lateral); background: linear-gradient(180deg, var(--lateral-1), var(--lateral-2));
    color: var(--navy-txt); display: flex; flex-direction: column; padding: 20px 0 16px 14px; z-index: 20; }
  .marca { display: flex; align-items: center; gap: 11px; padding: 2px 12px 22px 8px; }
  .marca .selo { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--verde), #14b8a6); color: #fff;
    display: grid; place-items: center; box-shadow: 0 6px 16px rgba(14, 159, 110, .35); }
  .marca b { color: #fff; font-size: 15px; display: block; letter-spacing: .01em; }
  .marca small { font-size: 10.5px; color: #94a3b8; letter-spacing: .1em; text-transform: uppercase; }
  .rotulo-menu { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #64748b; margin: 16px 10px 6px; }
  #menu { display: flex; flex-direction: column; gap: 2px; }
  #menu a { position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 14px; margin-right: 14px; border-radius: 12px;
    color: var(--navy-txt); text-decoration: none; font-weight: 500; transition: background .15s, color .15s; }
  #menu a:hover { background: rgba(255, 255, 255, .06); color: #fff; }
  /* Item ativo "encaixado" na página: mesmo fundo do conteúdo e cantos curvos invertidos */
  #menu a.ativo { transition: none; background: var(--fundo); color: var(--menu-ativo); font-weight: 700; margin-right: 0; border-radius: 14px 0 0 14px; }
  #menu a.ativo .ic { color: var(--azul); }
  #menu a.ativo::before, #menu a.ativo::after { content: ''; position: absolute; right: 0; width: 18px; height: 18px; background: transparent; pointer-events: none; }
  #menu a.ativo::before { top: -18px; border-bottom-right-radius: 18px; box-shadow: 6px 6px 0 6px var(--fundo); }
  #menu a.ativo::after { bottom: -18px; border-top-right-radius: 18px; box-shadow: 6px -6px 0 6px var(--fundo); }
  .contador { margin-left: auto; background: var(--verde); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 20px; }
  #menu a.ativo .contador { background: var(--azul); }
  .cartao-usuario { margin: auto 14px 0 0; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; background: rgba(255, 255, 255, .05); }
  .cartao-usuario b { color: #fff; font-size: 13px; display: block; }
  .cartao-usuario small { color: #94a3b8; font-size: 11px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #60a5fa, #a78bfa); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
  .avatar.p { width: 24px; height: 24px; font-size: 10px; }

  /* ---------------------------------------------------------------- Barra superior */
  .principal { margin-left: var(--lateral); min-height: 100vh; }
  .topo { position: sticky; top: 0; z-index: 10; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 28px;
    background: var(--topo-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--borda); }
  .migalhas { color: var(--suave); font-size: 13px; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; }
  .migalhas a { color: var(--suave); text-decoration: none; } .migalhas a:hover { color: var(--azul); }
  .migalhas b { color: var(--texto); }
  .busca { margin-left: auto; display: flex; align-items: center; gap: 8px; width: 360px; padding: 0 12px; height: 40px; border: 1px solid var(--borda);
    border-radius: 12px; background: var(--sup); color: var(--suave); cursor: text; }
  .busca:focus-within { border-color: var(--azul); box-shadow: 0 0 0 4px var(--azul-c); }
  .busca input { border: none; outline: none; padding: 0; height: 100%; background: transparent; font: inherit; flex: 1; min-width: 0; box-shadow: none !important; }
  kbd { font: 600 11px Inter, sans-serif; color: var(--suave); border: 1px solid var(--borda); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; background: var(--sup); white-space: nowrap; }
  .botao-suite { height: 40px; padding: 0 14px; border-radius: 12px; background: #0b8a4a; color: #fff; display: inline-flex; align-items: center; gap: 7px;
    font-weight: 800; letter-spacing: .05em; text-decoration: none; box-shadow: 0 4px 12px rgba(11, 138, 74, .25); }
  .botao-suite:hover { background: #097a41; }
  main { padding: 24px 28px 48px; max-width: 1400px; }
  #aviso-config { padding: 16px 28px 0; max-width: 1400px; }

  /* ---------------------------------------------------------------- Componentes */
  .card { background: var(--sup); border: 1px solid var(--borda); border-radius: var(--raio); box-shadow: var(--sombra); padding: 20px 22px; margin-bottom: 16px; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); }
  .cab-pagina { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 18px; }
  .cab-pagina p { margin: 2px 0 0; color: var(--suave); }
  .cab-pagina .acoes { margin-left: auto; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: var(--raio-p); padding: 9px 15px; font: 600 13px Inter, "Segoe UI", sans-serif;
    border: 1px solid var(--acao); background: var(--acao); color: #fff; cursor: pointer; text-decoration: none; transition: filter .15s, box-shadow .15s, background .15s; white-space: nowrap; }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .btn.sec { background: var(--sup); color: var(--texto-2); border-color: var(--borda-forte); }
  .btn.sec:hover { background: var(--sup-2); }
  .btn.verde { background: var(--acao-verde); border-color: var(--acao-verde); box-shadow: 0 4px 12px rgba(14, 159, 110, .28); }
  .btn.perigo { background: var(--sup); color: var(--vermelho); border-color: var(--perigo-borda); }
  .btn.perigo.cheio { background: var(--acao-perigo); color: #fff; border-color: var(--acao-perigo); }
  .btn.peq { padding: 6px 11px; font-size: 12px; border-radius: 9px; }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 600; background: var(--sup-3); color: var(--texto-2); white-space: nowrap; }
  .tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
  .tag.ABERTA, .tag.EM_ANDAMENTO { background: var(--azul-c); color: var(--azul); }
  .tag.AGUARDANDO_RETORNO, .tag.SUSPENSO, .tag.RASCUNHO { background: var(--ambar-c); color: var(--ambar); }
  .tag.CONCLUIDA, .tag.CONCLUIDO, .tag.FINAL, .tag.RESPONDIDA { background: var(--verde-c); color: var(--verde-esc); }
  .tag.DEVOLVIDA, .tag.CANCELADA, .tag.CANCELADO, .tag.atraso { background: var(--vermelho-c); color: var(--vermelho); }
  .tag.EM_ASSINATURA { background: var(--roxo-c); color: var(--roxo); }
  .tag.NAO_INICIADA { background: var(--sup-3); color: #9ca3af; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 5px 11px; border-radius: 20px; background: var(--sup-3); color: var(--texto-2); font-weight: 500; white-space: nowrap; }
  .chip.azul { background: var(--azul-c); color: var(--azul); } .chip.ambar { background: var(--ambar-c); color: var(--ambar); }
  .chip.vermelho { background: var(--vermelho-c); color: var(--vermelho); } .chip.verde { background: var(--verde-c); color: var(--verde-esc); }

  /* Formulários */
  label { display: block; font-size: 12px; font-weight: 600; color: var(--texto-2); margin: 12px 0 6px; }
  label .obrig, .obrig { color: var(--vermelho); }
  input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--borda-forte); border-radius: var(--raio-p); font: inherit; background: var(--sup); color: var(--texto);
    transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 4px var(--azul-c); }
  input:disabled, select:disabled, textarea:disabled, input[readonly] { background: var(--sup-2); color: var(--texto-3); }
  textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
  textarea.grande { min-height: 150px; }
  input[type=checkbox], input[type=radio] { width: 18px; height: 18px; accent-color: var(--azul); flex: none; }
  input[type=file] { padding: 7px; }
  .linha { display: flex; gap: 12px; } .linha > * { flex: 1; min-width: 0; }
  .check { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; margin: 0; font-weight: 500 !important; cursor: pointer; }
  .check:hover { background: var(--sup-2); }

  /* Tabelas */
  table { width: 100%; border-collapse: separate; border-spacing: 0; }
  th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--borda); vertical-align: middle; }
  th { font-size: 11px; color: var(--suave); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; background: var(--sup-2); }
  tr:first-child th:first-child { border-top-left-radius: 10px; } tr:first-child th:last-child { border-top-right-radius: 10px; }
  tr.clicavel { cursor: pointer; transition: background .12s; } tr.clicavel:hover td { background: var(--hover); }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .destoante { color: var(--vermelho); font-weight: 600; }

  /* ---------------------------------------------------------------- Painel */
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 18px; }
  .kpi { position: relative; background: var(--sup); border: 1px solid var(--borda); border-radius: var(--raio); padding: 18px; box-shadow: var(--sombra); overflow: hidden; }
  .kpi .ib { position: absolute; top: 16px; right: 16px; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--sup-3); color: var(--texto-3); }
  .kpi .r { color: var(--suave); font-size: 12.5px; font-weight: 500; padding-right: 46px; min-height: 34px; }
  .kpi .v { font-size: 30px; font-weight: 800; margin-top: 14px; letter-spacing: -.02em; }
  .kpi.destaque { background: linear-gradient(135deg, var(--navy), #143d66); border: none; color: #fff; box-shadow: 0 10px 24px rgba(11, 37, 64, .25); }
  .kpi.destaque .r { color: #bfd2e8; } .kpi.destaque .ib { background: rgba(255, 255, 255, .12); color: #fff; }
  .kpi.azul .ib { background: var(--azul-c); color: var(--azul); } .kpi.ambar .ib { background: var(--ambar-c); color: var(--ambar); }
  .kpi.vermelho .ib { background: var(--vermelho-c); color: var(--vermelho); } .kpi.roxo .ib { background: var(--roxo-c); color: var(--roxo); }
  .lista-tarefas .lt { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-bottom: 1px solid var(--borda); cursor: pointer; border-radius: 10px; }
  .lista-tarefas .lt:last-child { border-bottom: none; }
  .lista-tarefas .lt:hover { background: var(--hover); }
  .lt .ib { width: 36px; height: 36px; border-radius: 10px; background: var(--azul-c); color: var(--azul); display: grid; place-items: center; flex: none; }
  .lt .ib.ambar { background: var(--ambar-c); color: var(--ambar); }
  .lt b { display: block; font-size: 13px; } .lt small { color: var(--suave); }
  .lt .dir { margin-left: auto; text-align: right; }
  .kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .coluna { background: var(--kanban); border: 1px solid var(--borda); border-radius: 14px; padding: 12px; min-height: 140px; }
  .coluna h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); display: flex; justify-content: space-between; align-items: center; }
  .coluna h3 span:last-child { background: var(--sup); border: 1px solid var(--borda); border-radius: 20px; padding: 1px 8px; color: var(--texto); }
  .cartao { background: var(--sup); border: 1px solid var(--borda); border-radius: 12px; padding: 11px 12px; margin-bottom: 9px; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; }
  .cartao:hover { border-color: var(--borda-foco); box-shadow: 0 6px 16px rgba(37, 99, 235, .1); transform: translateY(-1px); }
  .cartao .n { font-size: 11px; color: var(--suave); font-weight: 600; } .cartao .t { font-weight: 700; margin: 3px 0 6px; }
  .cartao .e { font-size: 12px; color: var(--texto-2); display: grid; gap: 3px; }
  .ponto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--neutro-borda); margin-right: 6px; flex: none; }
  .ponto.ABERTA { background: var(--azul); box-shadow: 0 0 0 3px var(--azul-c); }
  .ponto.AGUARDANDO_RETORNO { background: var(--ambar-forte); box-shadow: 0 0 0 3px var(--ambar-c); }
  .ponto.CONCLUIDA { background: var(--verde); }

  /* ---------------------------------------------------------------- Processo */
  .proc { display: flex; gap: 20px; align-items: flex-start; }
  .proc .num-proc { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--azul); background: var(--azul-c); padding: 4px 11px; border-radius: 20px; }
  .proc h1 { font-size: 24px; margin: 10px 0 4px; }
  .proc .objeto { color: var(--suave); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .metas { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
  .meta { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--borda); border-radius: 12px; min-width: 0; }
  .meta .ib { width: 34px; height: 34px; border-radius: 10px; background: var(--sup-3); display: grid; place-items: center; color: var(--texto-3); flex: none; }
  .meta small { display: block; font-size: 11px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .meta b { font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proc .acoes { margin-left: auto; }
  .fases { display: flex; gap: 6px; padding: 16px 22px; }
  .fase-b { flex: 1; min-width: 0; }
  .fase-b .barra { height: 6px; border-radius: 6px; background: var(--linha); overflow: hidden; margin-bottom: 9px; }
  .fase-b .barra span { display: block; height: 100%; background: var(--verde); border-radius: 6px; }
  .fase-b small { font-size: 10.5px; color: var(--suave); text-transform: uppercase; letter-spacing: .06em; display: block; }
  .fase-b b { font-size: 12.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fase-b.atual b { color: var(--azul); } .fase-b.atual .barra span { background: var(--azul); }
  .fase-b.futura b { color: #94a3b8; font-weight: 600; }
  .abas { display: flex; gap: 4px; margin: 4px 0 16px; border-bottom: 1px solid var(--borda); }
  .abas a { padding: 10px 14px; text-decoration: none; color: var(--suave); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; align-items: center; gap: 7px; }
  .abas a:hover { color: var(--texto); }
  .abas a.ativo { color: var(--azul); border-bottom-color: var(--azul); }
  .abas a .qtd { background: var(--pilula); color: var(--texto-3); border-radius: 20px; font-size: 11px; padding: 0 7px; }
  .fluxo { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }

  /* Linha do tempo */
  .timeline { position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow: auto; }
  .timeline .fase { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); margin: 14px 0 8px; font-weight: 700; }
  .timeline .fase:first-of-type { margin-top: 0; }
