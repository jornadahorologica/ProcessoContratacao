<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <script>
    // Aplica o tema antes de desenhar a página (evita "piscar" em branco no modo escuro)
    (function () {
      var t = null;
      try { t = localStorage.getItem('cesop-tema'); } catch (e) { /* armazenamento indisponível */ }
      if (t !== 'claro' && t !== 'escuro') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
      document.documentElement.setAttribute('data-tema', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <?!= incluir('Estilos') ?>
</head>
<body>
  <aside class="lateral">
    <div class="marca">
      <div class="selo" data-ic="escudo"></div>
      <div><b id="app-nome">CESOP</b><small>Contratações</small></div>
    </div>
    <div class="rotulo-menu">Principal</div>
    <nav id="menu">
      <a href="#/painel" data-acao="ir" data-view="painel"><span data-ic="home"></span>Painel</a>
      <a href="#/processos" data-acao="ir" data-view="processos"><span data-ic="pasta"></span>Processos</a>
      <a href="#/minhas-tarefas" data-acao="ir" data-view="tarefas"><span data-ic="tarefas"></span>Minhas tarefas<span class="contador oculto" id="contador-tarefas"></span></a>
      <a href="#/novo-processo" data-acao="ir" data-view="novo"><span data-ic="mais"></span>Novo processo</a>
      <div class="rotulo-menu oculto" id="rotulo-gestao">Gestão</div>
      <a href="#/admin" data-acao="ir" data-view="admin" id="menu-admin" class="oculto"><span data-ic="config"></span>Administração</a>
    </nav>
    <div class="cartao-usuario">
      <div class="avatar" id="avatar">··</div>
      <div><b id="usuario">Carregando…</b><small id="usuario-papel"></small></div>
    </div>
  </aside>

  <div class="principal">
    <header class="topo">
      <div class="migalhas" id="migalhas"></div>
      <label class="busca" title="Buscar processos (Ctrl+K)">
        <span data-ic="busca" data-tam="16"></span>
        <input id="busca-global" placeholder="Buscar processo, nº SUITE, título…" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </label>
      <div class="tema" role="group" aria-label="Tema">
        <button type="button" data-acao="tema" data-tema="claro" title="Tema claro"><span data-ic="sol" data-tam="15"></span>Claro</button>
        <button type="button" data-acao="tema" data-tema="escuro" title="Tema escuro"><span data-ic="lua" data-tam="15"></span>Escuro</button>
      </div>
      <a class="botao-suite oculto" id="botao-suite" target="_blank" rel="noopener" title="Abrir o SUITE em nova aba">SUITE <span data-ic="externo" data-tam="14"></span></a>
    </header>
    <main id="app"><div class="carregando">Carregando…</div></main>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="ocupado" class="ocupado oculto"><div class="ocupado-caixa"><div class="spinner"></div><span>Processando…</span></div></div>
  <div id="dialogo" class="veu oculto"></div>

</html>
