<script>
/* Js_Acoes — Ações: o que cada botão/campo faz (cliques, alterações, teclado). */
// ------------------------------------------------------------------ AÇÕES (cliques)
function recarregarProcesso(msg) {
  return vProcesso().then(function () {
    Rotas.atualizar(true);
    if (msg) toast(msg);
  });
}

/**
 * Pop-up "Quem já assinou no SUITE?" para um tipo de documento.
 * Resolve com {data, ordens}, com null se o tipo não exige assinatura, ou false se o usuário cancelar.
 */
function perguntarAssinaturas(tipo, o) {
  o = o || {};
  if (!exigeAssinatura(tipo)) return Promise.resolve(null);
  var resp = S.det && S.det.processo.responsavelTecnico;
  var lista = '<div style="width:100%"><b>Quem já assinou no SUITE?</b>' + (S.ctx.assinaturasPorTipo[tipo] || []).map(function (a) {
    var nome = a.signatario === '{{responsavelTecnico}}' ? (resp || 'Responsável técnico') : a.signatario;
    return '<label class="check"><input type="checkbox" class="dlg-assinante" value="' + esc(a.ordem) + '" checked> ' +
      esc(nome) + (a.cargo ? ' <span class="ajuda">' + esc(a.cargo) + '</span>' : '') + '</label>';
  }).join('') + (o.permiteNenhum ? '<p class="ajuda">Desmarque quem ainda não assinou: o documento fica "em assinatura" e você registra o restante depois.</p>' : '') + '</div>';
  return Dialogo.abrir({ tipo: 'sucesso', icone: 'assinar', titulo: o.titulo || 'Assinaturas — ' + nomeTipoDoc(tipo), texto: o.texto || '',
    detalhe: lista, campo: { tipo: 'date', rotulo: 'Data da assinatura', valor: hojeISO(), obrigatorio: true },
    ok: o.ok || 'Registrar assinaturas', classeOk: 'verde', iconeOk: 'check',
    ler: function (raiz, data) {
      var ordens = $$('.dlg-assinante', raiz).filter(function (x) { return x.checked; }).map(function (x) { return Number(x.value); });
      if (!ordens.length && !o.permiteNenhum) { toast('Marque ao menos um signatário.', true); return undefined; }
      return { data: data, ordens: ordens };
    } }).then(function (r) { return r || false; });
}

/** Etapa atual não iniciada (adiantar)? Usa as operações por etapa em vez das da tarefa. */
function adiantando() { return !!(S.etapaFutura && S.tar && S.tar.antecipada); }

var ACOES = {
  tema: function (d) { aplicarTema(d.tema, true); },
  ir: function (d) { if (d.view === 'processos') S.filtro = null; ir(d.view); },
  abrirProcesso: function (d) { abrirProcesso(d.proc, null, d.aba); },
  abrirTarefa: function (d) { abrirProcesso(d.proc, d.tarefa, 'fluxo'); },
  aba: function (d) {
    S.aba = d.aba;
    $$('.abas a').forEach(function (a) { a.classList.toggle('ativo', a.dataset.aba === d.aba); });
    Promise.resolve(renderAba()).then(function () { Rotas.atualizar(); });
  },
  selTarefa: function (d) { carregarTarefa(d.tarefa).then(function () { Rotas.atualizar(); }); },
  selEtapa: function (d) { carregarEtapaFutura(d.etapa).then(function () { Rotas.atualizar(); }); },
  filtrar: function () { S.filtro = { texto: $('#f-texto').value, status: (S.filtro || {}).status || '' }; ir('processos'); },

  criarProcesso: function () {
    var v = valoresForm($('#form-novo'));
    ocupado(api('criarProcesso', v), 'Processo criado.').then(function (p) {
      abrirProcesso(p.id);
    });
  },
  statusProcesso: function (d) {
    var cfg = {
      SUSPENSO: { titulo: 'Suspender o processo?', ok: 'Suspender', classe: '', tipo: 'aviso', icone: 'relogio' },
      CANCELADO: { titulo: 'Cancelar o processo?', ok: 'Cancelar processo', classe: 'perigo cheio', tipo: 'perigo', icone: 'alerta',
        texto: 'As etapas em andamento serão encerradas. Essa ação não pode ser desfeita.' },
      EM_ANDAMENTO: { titulo: 'Retomar o processo?', ok: 'Retomar', classe: 'verde', tipo: 'sucesso', icone: 'atualizar' }
    }[d.status];
    Dialogo.abrir({ tipo: cfg.tipo, icone: cfg.icone, titulo: cfg.titulo, texto: cfg.texto || 'O motivo ficará registrado no histórico do processo.',
      campo: { tipo: 'textarea', rotulo: 'Motivo', obrigatorio: true }, ok: cfg.ok, classeOk: cfg.classe, cancelar: 'Voltar' })
      .then(function (motivo) { if (motivo) acaoTela('alterarStatusProcesso', [S.procId, d.status, motivo], 'Status do processo alterado.'); });
  },
  salvarProcesso: function () {
    acaoTela('atualizarProcesso', [S.procId, valoresForm($('#form-dados'))], 'Dados salvos.');
  },

  salvarCampos: function (d) {
    var v = valoresForm($(d.raiz));
    if (adiantando()) return acaoTela('salvarCamposEtapa', [S.procId, S.etapaFutura, v], 'Dados adiantados e salvos.');
    acaoTela('salvarCampos', [S.tarefaId, v], 'Dados salvos.');
  },
  checklist: function (d, el) {
    if (adiantando()) return acaoTela('marcarChecklistEtapa', [S.procId, S.etapaFutura, d.item, el.checked]);
    acaoTela('marcarChecklist', [S.tarefaId, d.item, el.checked]);
  },
  adicionarLinhaTab: function (d, el) {
    var box = el.closest('.campo-tabela');
    var tbody = $('table', box).tBodies[0] || $('table', box);
    tbody.appendChild($('template', box).content.cloneNode(true));
    var ultima = $$('tr.linha-tab', box).pop();
    var campo = ultima && $('input, textarea, select', ultima);
    if (campo) campo.focus();
  },
  removerLinhaTab: function (d, el) {
    var box = el.closest('.campo-tabela');
    var linhas = $$('tr.linha-tab', box);
    if (linhas.length > 1) el.closest('tr').remove();
    else $$('input, textarea, select', linhas[0]).forEach(function (x) { x.value = ''; });
  },
  registrarEnvio: function () {
    acaoTela('registrarEnvio', [S.tarefaId, $('#env-ref').value, $('#env-data').value], 'Envio registrado.');
  },
  registrarRetorno: function () {
    acaoTela('registrarRetorno', [S.tarefaId, $('#ret-ref').value, $('#ret-data').value], 'Retorno registrado.');
  },
  concluir: function () {
    var nome = S.tar.etapa.nome;
    var prox = (S.tar.proximas || []).filter(function (x) { return !x.automatica; });
    var auto = (S.tar.proximas || []).filter(function (x) { return x.automatica; });
    var detalhe = prox.length
      ? ic('seta', 16) + '<span>' + (prox.length > 1 ? 'Próximas etapas (em paralelo):' : 'Próxima etapa:') + ' <b>' + prox.map(function (x) { return esc(x.nome); }).join(', ') + '</b></span>'
      : auto.length ? ic('seta', 16) + '<span>' + esc(auto[0].nome) + '</span>' : '';
    Dialogo.abrir({ tipo: 'sucesso', icone: 'check', titulo: 'Concluir “' + nome + '”?',
      texto: 'Os dados e documentos desta etapa ficarão registrados no histórico e o processo avançará no fluxo.',
      detalhe: detalhe, ok: 'Concluir e avançar', classeOk: 'verde', iconeOk: 'check' })
      .then(function (ok) {
        if (!ok) return;
        acaoTela('concluirTarefa', [S.tarefaId, $('#obs-concluir').value], null, { auto: true }).then(function (r) {
          var atual = S.tar && S.tar.ativa ? S.tar.etapa.nome : '';
          toast(atual ? 'Agora em: ' + atual : 'O processo seguiu no fluxo.', false, '“' + nome + '” concluída');
          if (r && r.aviso) toast(r.aviso, true, 'Documento não gerado');
        });
      });
  },
  devolver: function () {
    var destino = $('#dev-destino').value, motivo = $('#dev-motivo').value;
    if (!motivo) return toast('Informe o motivo da devolução.', true);
    var nomeDestino = $('#dev-destino').selectedOptions[0].textContent;
    Dialogo.abrir({ tipo: 'aviso', icone: 'voltar', titulo: 'Devolver para “' + nomeDestino + '”?',
      texto: 'A etapa atual será encerrada como devolvida e o processo voltará para a etapa escolhida.',
      detalhe: ic('editar', 16) + '<span>Motivo: <b>' + esc(motivo) + '</b></span>', ok: 'Devolver', classeOk: 'perigo cheio', iconeOk: 'voltar' })
      .then(function (ok) { if (ok) acaoTela('devolverTarefa', [S.tarefaId, destino, motivo], 'Processo devolvido para “' + nomeDestino + '”.', { auto: true }); });
  },

  gerarDoc: function (d) {
    acaoTela('gerarDocumento', [S.procId, d.tipo, S.tarefaId]).then(function (doc) {
      toast('Revise o texto antes de enviar para assinatura.', false, 'Documento gerado', { rotulo: 'Abrir documento', url: doc.url });
    });
  },
  anexar: function (d) {
    var p = d.prefixo;
    var noFluxo = p === 'wt';
    var tipo = $('#' + p + '-tipo').value;
    lerArquivo($('#' + p + '-arq')).then(function (arq) {
      // Documento assinado no SUITE: pergunta quem já assinou o PDF anexado
      return perguntarAssinaturas(tipo, { titulo: 'Anexar PDF — ' + nomeTipoDoc(tipo), ok: 'Anexar', permiteNenhum: true,
        texto: 'Este documento é assinado no SUITE. Marque quem já assinou o PDF que está sendo anexado.' })
        .then(function (ass) {
          if (ass === false) return;
          return acaoTela('anexarDocumento', [S.procId, tipo, noFluxo ? S.tarefaId : '', arq, ass], 'Documento anexado.');
        });
    }).catch(function (e) { toast(e.message, true); });
  },
  vincular: function (d) {
    var p = d.prefixo;
    var noFluxo = p === 'wt';
    var link = $('#' + p + '-link').value;
    if (!link) return toast('Informe o link do arquivo.', true);
    var tipoDoc = $('#' + p + '-tipo').value;
    Dialogo.abrir({ icone: 'link', titulo: 'Vincular arquivo do Drive', texto: 'Deseja mover o arquivo para a pasta deste processo ou apenas registrar o link?',
      botoes: [{ rotulo: 'Cancelar', valor: null, classe: 'sec' }, { rotulo: 'Apenas vincular', valor: 'vincular', classe: 'sec' },
        { rotulo: 'Mover para a pasta', valor: 'mover', icone: 'pasta' }] })
      .then(function (op) {
        if (!op) return;
        return perguntarAssinaturas(tipoDoc, { titulo: 'Vincular PDF — ' + nomeTipoDoc(tipoDoc), ok: 'Vincular', permiteNenhum: true,
          texto: 'Este documento é assinado no SUITE. Marque quem já assinou o arquivo vinculado.' })
          .then(function (ass) {
            if (ass === false) return;
            acaoTela('vincularDocumento', [S.procId, tipoDoc, noFluxo ? S.tarefaId : '', link, op === 'mover', ass], 'Documento vinculado.');
          });
      });
  },
  /** Assinatura em um passo: marca quem assinou no SUITE e a data; o sistema gera o documento se preciso. */
  assinarSuite: function (d) {
    var tipo = d.tipo;
    perguntarAssinaturas(tipo, { titulo: 'Assinar no SUITE — ' + nomeTipoDoc(tipo),
      texto: (S.tar && S.tar.documentoDesatualizado && S.tar.etapa.documentoTipo === tipo ? 'Os dados mudaram: o documento será gerado novamente. ' : '') +
        'O sistema gera o documento e o PDF (se ainda não existirem) e registra as assinaturas marcadas.' })
      .then(function (r) {
        if (!r) return;
        acaoTela('assinarNoSuite', [S.procId, tipo, S.tarefaId, r.data, r.ordens]).then(function (doc) {
          toast(doc.status === 'FINAL' ? 'Todas as assinaturas registradas — documento FINAL.' : 'Assinaturas registradas; ainda faltam signatários.',
            false, 'Assinaturas no SUITE', doc.pdfUrl ? { rotulo: 'Abrir PDF', url: doc.pdfUrl } : null);
        });
      });
  },
  enviarAssinatura: function (d) {
    Dialogo.abrir({ icone: 'assinar', titulo: 'Enviar para assinatura no SUITE',
      texto: 'O sistema vai gerar o PDF do documento. Junte-o ao processo no SUITE e, a cada assinatura feita lá, registre aqui.',
      ok: 'Gerar PDF', iconeOk: 'doc' })
      .then(function (ok) { if (ok) acaoTela('enviarParaAssinatura', [d.doc], 'PDF gerado. Junte-o ao SUITE para assinatura.'); });
  },
  registrarAssinatura: function (d) {
    Dialogo.abrir({ tipo: 'sucesso', icone: 'assinar', titulo: 'Registrar assinatura', texto: 'Informe a data em que o documento foi assinado no SUITE.',
      campo: { tipo: 'date', rotulo: 'Data da assinatura', valor: hojeISO(), obrigatorio: true }, ok: 'Registrar', classeOk: 'verde', iconeOk: 'check' })
      .then(function (data) { if (data) acaoTela('registrarAssinatura', [d.id, data], 'Assinatura registrada.'); });
  },
  usarSugestao: function (d) {
    var s = S.tar.sugestoes[d.campo];
    var el = $('#bloco-form [name="' + d.campo + '"]');
    if (!s || !el) return;
    el.value = s.valor;
    el.focus();
    toast('Sugestão aplicada. Revise e clique em "Salvar dados".');
  },
  expandirSecoes: function () {
    var secoes = $$('#bloco-form details.secao');
    var abrir = secoes.some(function (x) { return !x.open; });
    secoes.forEach(function (x) { x.open = abrir; });
  },
  statusDoc: function (d) {
    acaoTela('alterarStatusDocumento', [d.doc, d.status], 'Status do documento alterado.');
  },

  salvarCotacao: function () {
    acaoTela('salvarCotacao', [S.procId, valoresForm($('#form-cot'))], 'Cotação registrada.');
  },
  removerCotacao: function (d) {
    Dialogo.abrir({ tipo: 'perigo', icone: 'lixo', titulo: 'Excluir esta cotação?', texto: 'A exclusão fica registrada no histórico.',
      ok: 'Excluir', classeOk: 'perigo cheio' })
      .then(function (ok) { if (ok) acaoTela('removerCotacao', [d.id], 'Cotação excluída.'); });
  },
  considerarCotacao: function (d, el) {
    if (el.checked) return acaoTela('considerarCotacao', [d.id, true, ''], 'Cotação considerada no cálculo.');
    el.checked = true; // só desmarca depois de informado o motivo
    Dialogo.abrir({ tipo: 'aviso', icone: 'x', titulo: 'Descartar esta cotação?',
      texto: 'Ela deixa de entrar no cálculo do mapa. O motivo fica registrado na planilha e no histórico.',
      campo: { tipo: 'textarea', rotulo: 'Motivo do descarte', obrigatorio: true, placeholder: 'Ex.: preço 60% acima da mediana, fora da realidade de mercado' },
      ok: 'Descartar', classeOk: 'perigo cheio' })
      .then(function (motivo) { if (motivo) acaoTela('considerarCotacao', [d.id, false, motivo], 'Cotação descartada.'); });
  },
  gerarMapa: function () {
    acaoTela('gerarMapa', [S.procId, $('#mapa-metodo').value, S.tarefaId]).then(function (doc) {
      toast('Planilha criada na pasta Orçamento.', false, 'Mapa comparativo gerado', { rotulo: 'Abrir planilha', url: doc.url });
    });
  },

  registrarDiligencia: function () {
    acaoTela('registrarDiligencia', [S.procId, valoresForm($('#form-dil'))], 'Diligência registrada.');
  },
  responderDiligencia: function (d) {
    var resposta = $('#resp-' + d.id).value;
    var input = $('#resparq-' + d.id);
    var envio = input.files && input.files[0]
      ? lerArquivo(input).then(function (arq) { return api('anexarDocumento', S.procId, 'RESPOSTA_DESPACHO', '', arq); }).then(function (doc) { return doc.id; })
      : Promise.resolve('');
    envio.then(function (docId) { return acaoTela('responderDiligencia', [d.id, resposta, docId], 'Resposta registrada.'); })
      .catch(function (e) { toast(e.message, true); });
  },

  editarUsuario: function (d) {
    api('listarUsuarios').then(function (us) {
      var u = us.filter(function (x) { return x.email === d.email; })[0];
      var f = $('#form-usu');
      ['email', 'nome', 'setor', 'papel'].forEach(function (k) { $('[name=' + k + ']', f).value = u[k] || ''; });
      $('[name=ativo]', f).checked = !!u.ativo;
    });
  },
  salvarUsuario: function () {
    ocupado(api('salvarUsuario', valoresForm($('#form-usu')))).then(function (u) {
      var a = u.acessoDrive;
      if (a && a.falhas.length) toast(a.falhas.slice(0, 3).join('\n'), true, 'Usuário salvo, mas sem acesso a algumas pastas do Drive');
      else toast(a ? 'Acesso liberado às pastas de ' + a.ok + ' processo(s) no Drive.' : 'Dados atualizados.', false, 'Usuário salvo');
      return api('contexto').then(function (c) { S.ctx = c; ir('admin'); });
    });
  },
  concederAcessoDrive: function () {
    Dialogo.abrir({ icone: 'pasta', titulo: 'Liberar acesso às pastas do Drive?',
      texto: 'Todos os usuários ativos recebem acesso de edição às pastas de todos os processos. A pasta raiz (onde fica o banco de dados) não é compartilhada.',
      ok: 'Liberar acesso' })
      .then(function (ok) {
        if (!ok) return;
        ocupado(api('concederAcessoDrive')).then(function (r) {
          if (r.falhas.length) toast(r.falhas.slice(0, 5).join('\n'), true, 'Acesso liberado, com ' + r.falhas.length + ' falha(s)');
          else toast(r.ok + ' permissão(ões) conferida(s).', false, 'Acesso às pastas liberado');
        });
      });
  },
  atualizarConfiguracao: function () {
    Dialogo.abrir({ icone: 'atualizar', titulo: 'Aplicar atualizações da configuração?', texto: 'Nenhum processo ou dado é apagado.', ok: 'Aplicar' })
      .then(function (ok) { if (ok) ACOES.aplicarAtualizacoes(); });
  },
  irPendencia: function (d) {
    var alvo = alvoPendencia(S.tar.pendencias[Number(d.i)]);
    var bloco = alvo && $('#' + alvo.bloco);
    if (!bloco) return;
    bloco.scrollIntoView({ behavior: 'smooth', block: 'start' });
    bloco.classList.add('destacado');
    setTimeout(function () { bloco.classList.remove('destacado'); }, 1800);
    if (alvo.rotulo) {
      var rot = $$('label, summary', bloco).filter(function (l) { return l.textContent.indexOf(alvo.rotulo) >= 0; })[0];
      if (!rot) return;
      var sec = rot.closest('details');
      if (sec) sec.open = true;
      // Campo dentro de uma seção: o rótulo é <label> (usa o campo dele); a seção em si: o texto da seção
      var entrada = (rot.tagName === 'LABEL' ? rot.parentNode : (sec || rot.parentNode)).querySelector('textarea, input:not([type=checkbox]), select');
      if (entrada) {
        setTimeout(function () { entrada.focus({ preventScroll: true }); }, 350);
        entrada.classList.add('campo-destacado');
        setTimeout(function () { entrada.classList.remove('campo-destacado'); }, 2200);
      }
    }
  },
  filtroStatus: function (d) {
    S.filtro = { texto: ($('#f-texto') || {}).value || '', status: d.status };
    ir('processos');
  },
  testarGeracao: function () {
    var el = $('#log-teste-doc');
    ocupado(api('testarGeracaoDocumento')).then(function (passos) {
      var falhas = passos.filter(function (x) { return !x.ok; }).length;
      el.innerHTML = '<table>' + passos.map(function (x) {
        return '<tr><td>' + (x.ok ? '<span style="color:var(--verde)">' + ic('check', 15) + '</span>' : '<span style="color:var(--vermelho)">' + ic('x', 15) + '</span>') +
          '</td><td>' + esc(x.passo) + '</td><td>' + esc(x.detalhe) + '</td></tr>';
      }).join('') + '</table>';
      el.classList.remove('oculto');
      toast(falhas ? falhas + ' passo(s) com erro: veja o detalhe na tabela.' : 'A geração de documentos está funcionando.', !!falhas, 'Teste de geração de documento');
    });
  },
  aplicarAtualizacoes: function () {
    ocupado(api('atualizarConfiguracao'), 'Configuração atualizada.').then(function (log) {
      return api('contexto').then(function (c) {
        S.ctx = c;
        avisoConfiguracao();
        return ir(S.view === 'admin' ? 'admin' : S.view).then(function () {
          var el = $('#log-config');
          if (el) { el.textContent = log.join('\n'); el.classList.remove('oculto'); }
        });
      });
    });
  },
  recarregarConfig: function () {
    ocupado(api('recarregarConfig'), 'Configuração recarregada.').then(function () {
      return api('contexto').then(function (c) { S.ctx = c; });
    });
  }
};

var MUDANCAS = {
  /** Item já cotado: preenche e trava unidade e quantidade (mesmos valores para todas as cotações do item). */
  itemCotacao: function (el) {
    var f = $('#form-cot');
    var chave = String(el.value || '').trim().replace(/\s+/g, ' ').toUpperCase();
    var item = ((S.tar && S.tar.itensCotados) || {})[chave];
    ['unidade', 'quantidade'].forEach(function (k) {
      var campo = $('[name=' + k + ']', f);
      campo.readOnly = !!item;
      if (item) campo.value = item[k] === null || item[k] === undefined ? '' : item[k];
    });
    if (item && !$('[name=descricao]', f).value) $('[name=descricao]', f).value = item.descricao || '';
  },
  nsa: function (el) {
    var area = el.closest('.secao-corpo').querySelector('textarea');
    area.placeholder = el.checked ? 'Justificativa do “Não se aplica”' : 'Texto da seção';
    if (el.checked) area.focus();
  },
  atribuir: function (el) {
    ocupado(api('atribuirTarefa', S.tarefaId, el.value), 'Analista responsável alterado.');
  },
  metodoMapa: function (el) {
    api('calcularMapa', S.procId, el.value).then(function (m) { S.tar.mapa = m; renderTrabalho(); });
  }
};

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-acao]');
  if (!el) return;
  if (el.type !== 'checkbox' && el.type !== 'radio') ev.preventDefault();
  var fn = ACOES[el.dataset.acao];
  if (fn) fn(el.dataset, el);
});
document.addEventListener('keydown', function (ev) {
  if (ev.target.dataset && ev.target.dataset.inteiro && /^[.,eE+\-]$/.test(ev.key)) ev.preventDefault();
});
document.addEventListener('change', function (ev) {
  var el = ev.target.closest('[data-change]');
  if (el && MUDANCAS[el.dataset.change]) MUDANCAS[el.dataset.change](el);
  if (ev.target.closest('#area-trabalho')) reavaliarCondicoes(); // campos que dependem da resposta (ex.: justificativa se SIM)
});
</script>
