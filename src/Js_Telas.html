<script>
/* Js_Telas — Telas: painel, minhas tarefas, lista de processos e novo processo. */
// ------------------------------------------------------------------ PAINEL
function contadorTarefas(n) {
  var el = $('#contador-tarefas');
  el.textContent = n;
  el.classList.toggle('oculto', !n);
}

function linhaTarefaHtml(t, extra, icone) {
  return '<div class="lt" data-acao="abrirTarefa" data-proc="' + esc(t.processoId) + '" data-tarefa="' + esc(t.id) + '">' +
    '<div class="ib' + (t.status === 'AGUARDANDO_RETORNO' ? ' ambar' : '') + '">' + ic(icone || (t.status === 'AGUARDANDO_RETORNO' ? 'relogio' : 'doc'), 17) + '</div>' +
    '<div><b>' + esc(t.nome) + '</b><small>' + esc(t.numero) + ' · ' + esc(t.titulo) + '</small></div>' +
    '<div class="dir">' + extra(t) + '</div></div>';
}
function prazoHtml(t) {
  if (!t.prazo) return '<span class="ajuda">Sem prazo</span>';
  var d = diasEntre(hojeISO(), t.prazo);
  var cls = d < 0 ? 'vermelho' : d <= 2 ? 'ambar' : '';
  var txt = d < 0 ? 'Atrasada ' + (-d) + 'd' : d === 0 ? 'Vence hoje' : 'Em ' + d + ' dia' + (d > 1 ? 's' : '');
  return '<span class="chip ' + cls + '">' + ic('relogio', 13) + txt + '</span><br><span class="ajuda">' + dataBR(t.prazo) + '</span>';
}

function vPainel() {
  migalhas([['Painel']]);
  return api('painel').then(function (d) {
    var k = d.indicadores;
    contadorTarefas(k.minhasTarefas);
    var kpi = function (v, r, icone, cls) {
      return '<div class="kpi ' + (cls || '') + '"><div class="ib">' + ic(icone, 18) + '</div><div class="r">' + r + '</div><div class="v">' + v + '</div></div>';
    };
    var fases = S.ctx.fases.filter(function (f) { return f.codigo !== 'CONCLUIDO'; });
    var porFase = {};
    d.processos.forEach(function (p) { (porFase[p.fase] = porFase[p.fase] || []).push(p); });
    var primeiro = String(S.ctx.usuario.nome || '').split(' ')[0];
    app(cabPagina('Olá, ' + primeiro + '!', 'Acompanhe suas etapas e o andamento dos processos de contratação.',
        '<a class="btn" href="#/novo-processo" data-acao="ir" data-view="novo">' + ic('mais', 16) + 'Novo processo</a>') +
      '<div class="kpis">' + kpi(k.emAndamento, 'Processos em andamento', 'pasta', 'destaque') + kpi(k.minhasTarefas, 'Minhas tarefas', 'tarefas', 'azul') +
      kpi(k.aguardandoRetorno, 'Aguardando outro setor', 'relogio', 'ambar') + kpi(k.atrasadas, 'Tarefas atrasadas', 'alerta', 'vermelho') +
      kpi(k.diligenciasAbertas, 'Diligências abertas', 'balanca', 'roxo') + '</div>' +
      '<div class="grid g2">' +
      '<div class="card"><h2>Minhas tarefas</h2><div class="lista-tarefas">' + (d.minhasTarefas.length ?
        d.minhasTarefas.slice(0, 8).map(function (t) { return linhaTarefaHtml(t, prazoHtml); }).join('') :
        '<div class="vazio">' + ic('check', 16) + 'Nenhuma tarefa atribuída a você.</div>') + '</div>' +
        (d.minhasTarefas.length > 8 ? '<a class="btn sec peq" href="#/minhas-tarefas" data-acao="ir" data-view="tarefas">Ver todas (' + d.minhasTarefas.length + ')</a>' : '') + '</div>' +
      '<div class="card"><h2>Aguardando retorno de outros setores</h2><div class="lista-tarefas">' + (d.aguardandoRetorno.length ?
        d.aguardandoRetorno.map(function (t) {
          return linhaTarefaHtml(t, function (t) { return '<b>' + (t.diasAguardando || 0) + ' dias</b><span class="ajuda">desde ' + dataBR(t.enviadoEm) + '</span>'; });
        }).join('') : '<div class="vazio">' + ic('check', 16) + 'Nada aguardando retorno.</div>') + '</div>' +
      (d.diligencias.length ? '<h2 style="margin-top:18px">Diligências abertas</h2><table><tr><th>Processo</th><th>Despacho</th><th>Prazo</th></tr>' +
        d.diligencias.map(function (x) {
          return '<tr class="clicavel" data-acao="abrirProcesso" data-proc="' + esc(x.processoId) + '" data-aba="diligencias"><td><b>' + esc(x.numero) +
            '</b></td><td>' + esc(x.numeroDespacho) + '</td><td>' + dataBR(x.prazo) + (x.atrasada ? ' ' + tag('atraso', 'Vencida') : '') + '</td></tr>';
        }).join('') + '</table>' : '') + '</div>' +
      '</div>' +
      '<div class="card"><h2>Processos por fase</h2><div class="kanban">' + fases.map(function (f) {
        var lista = porFase[f.codigo] || [];
        return '<div class="coluna"><h3><span>' + esc(f.nome) + '</span><span>' + lista.length + '</span></h3>' +
          lista.map(function (p) {
            return '<div class="cartao" data-acao="abrirProcesso" data-proc="' + esc(p.id) + '">' +
              '<div class="n">' + esc(p.numero) + (p.numeroSuite ? ' · SUITE ' + esc(p.numeroSuite) : '') + '</div>' +
              '<div class="t">' + esc(p.titulo) + '</div>' +
              '<div class="e">' + p.etapasAtuais.map(function (e) { return '<span>' + pontoStatus(e.status) + esc(e.nome) + '</span>'; }).join('') + '</div>' +
              (p.atrasado ? '<div style="margin-top:6px">' + tag('atraso', 'Atrasado') + '</div>' : '') + '</div>';
          }).join('') + '</div>';
      }).join('') + '</div></div>');
  });
}

function vTarefas() {
  migalhas([['Painel', '#/painel', 'painel'], ['Minhas tarefas']]);
  return api('painel').then(function (d) {
    contadorTarefas(d.indicadores.minhasTarefas);
    app(cabPagina('Minhas tarefas', 'Etapas sob sua responsabilidade, ordenadas pelo prazo.') +
      '<div class="card"><div class="lista-tarefas">' + (d.minhasTarefas.length ?
        d.minhasTarefas.map(function (t) { return linhaTarefaHtml(t, prazoHtml); }).join('') :
        '<div class="vazio">' + ic('check', 16) + 'Nenhuma tarefa atribuída a você. Bom trabalho!</div>') + '</div></div>' +
      (d.aguardandoRetorno.length ? '<div class="card"><h2>Aguardando retorno de outros setores</h2><div class="lista-tarefas">' +
        d.aguardandoRetorno.map(function (t) {
          return linhaTarefaHtml(t, function (t) { return '<b>' + (t.diasAguardando || 0) + ' dias</b><br><span class="ajuda">' + esc(nomeUsuario(t.responsavelEmail)) + '</span>'; });
        }).join('') + '</div></div>' : ''));
  });
}

// ------------------------------------------------------------------ LISTA
function vProcessos() {
  var filtro = S.filtro || { texto: '', status: '' };
  migalhas([['Processos']]);
  return api('listarProcessos', filtro).then(function (lista) {
    app(cabPagina('Processos', lista.length + ' processo(s)' + (filtro.texto ? ' para “' + esc(filtro.texto) + '”' : ''),
        '<a class="btn" href="#/novo-processo" data-acao="ir" data-view="novo">' + ic('mais', 16) + 'Novo processo</a>') +
      '<div class="card"><div class="filtros"><div class="pilulas">' +
      [['', 'Todos'], ['EM_ANDAMENTO', 'Em andamento'], ['SUSPENSO', 'Suspensos'], ['CONCLUIDO', 'Concluídos'], ['CANCELADO', 'Cancelados']].map(function (x) {
        return '<button data-acao="filtroStatus" data-status="' + x[0] + '" class="' + ((filtro.status || '') === x[0] ? 'on' : '') + '">' + x[1] + '</button>';
      }).join('') + '</div>' +
      '<div style="flex:1;min-width:220px"><input id="f-texto" placeholder="Filtrar por número, título, objeto ou SUITE" value="' + esc(filtro.texto) + '"></div>' +
      '<button class="btn sec" data-acao="filtrar">' + ic('busca', 15) + 'Filtrar</button></div></div>' +
      '<div class="card" style="padding:8px">' + (lista.length ? '<table><tr><th>Número</th><th>Título</th><th>Status</th><th>Fase</th><th>Etapa(s) atual(is)</th><th>Analista responsável</th><th class="num">Valor estimado</th></tr>' +
        lista.map(function (p) {
          return '<tr class="clicavel" data-acao="abrirProcesso" data-proc="' + esc(p.id) + '"><td><b>' + esc(p.numero) + '</b>' +
            (p.numeroSuite ? '<br><span class="ajuda">SUITE ' + esc(p.numeroSuite) + '</span>' : '') + '</td><td>' + esc(p.titulo) + '</td>' +
            '<td>' + tag(p.status) + (p.atrasado ? ' ' + tag('atraso', 'Atrasado') : '') + '</td><td>' + esc(nomeFase(p.fase)) + '</td>' +
            '<td>' + p.etapasAtuais.map(function (e) { return pontoStatus(e.status) + esc(e.nome); }).join('<br>') + '</td>' +
            '<td>' + esc(nomeUsuario(p.responsavelEmail)) + '</td><td class="num">' + brl(p.valorEstimado) + '</td></tr>';
        }).join('') + '</table>' : '<div class="vazio" style="padding:20px">' + ic('busca', 16) + 'Nenhum processo encontrado.</div>') + '</div>');
  });
}

// ------------------------------------------------------------------ NOVO
function vNovo() {
  if (!podeEditar()) { app('<div class="card">Seu perfil é somente leitura.</div>'); return; }
  migalhas([['Processos', '#/processos', 'processos'], ['Novo processo']]);
  app(cabPagina('Novo processo de contratação', 'Ao criar, o sistema gera o número, cria as pastas no Drive e inicia o fluxo.') +
    '<div class="card" id="form-novo" style="max-width:820px"><div class="cab-proc" style="display:flex;justify-content:space-between;align-items:center">' +
    '<h2 style="margin:0">Dados iniciais</h2><div class="logos-externos" style="margin:0">' + logosExternos('NOVO') + '</div></div>' +
    '<label>Fluxo</label><select name="fluxoId">' + S.ctx.fluxos.map(function (f) { return '<option value="' + esc(f.id) + '">' + esc(f.nome) + '</option>'; }).join('') + '</select>' +
    '<label>Título <span class="obrig">*</span></label><input name="titulo" placeholder="Ex.: Novo contrato SGS">' +
    '<label>Objeto da contratação <span class="obrig">*</span></label><textarea name="objeto"></textarea>' +
    '<div class="linha"><div><label>Setor demandante</label><input name="setorDemandante"></div>' +
    '<div><label>Nº do processo SUITE (se já houver)</label><input name="numeroSuite"></div></div>' +
    '<div class="linha"><div><label>Analista responsável</label><select name="responsavelEmail">' + opcoesUsuarios(S.ctx.usuario.email) + '</select></div>' +
    '<div><label>Responsável técnico</label><input name="responsavelTecnico" list="lista-resp-tecnico" value="' + esc(S.ctx.responsavelTecnicoPadrao) + '"></div></div>' +
    datalistUsuarios() +
    '<div class="acoes" style="margin-top:18px"><button class="btn verde" data-acao="criarProcesso">' + ic('check', 16) + 'Criar processo</button></div></div>');
}
</script>
